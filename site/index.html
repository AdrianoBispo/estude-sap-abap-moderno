  --sapContent_LabelColor:#8396a8;--sapContent_DisabledTextColor:rgba(245,246,247,.6);--sapContent_FocusColor:#9ad3ff;
  --sapContent_Shadow0:0 0 .125rem 0 rgba(255,255,255,.6),0 .125rem .5rem 0 rgba(0,0,0,.2);
  --sapContent_Shadow1:0 0 0 .0625rem rgba(255,255,255,.35),0 .125rem .5rem 0 rgba(0,0,0,.6);
  --sapContent_Shadow2:0 0 0 .0625rem rgba(255,255,255,.35),0 .625rem 1.875rem 0 rgba(0,0,0,.6);
  --sapShell_Shadow:0 .125rem .125rem 0 rgba(0,0,0,.8),inset 0 -.0625rem 0 0 rgba(255,255,255,.2);
  --sapNegativeColor:#fa6161;--sapCriticalColor:#ffdf72;--sapPositiveColor:#97dd40;--sapInformativeColor:#4db1ff;--sapNeutralColor:#a9b4be;
  --sapErrorBackground:#350000;--sapWarningBackground:#382700;--sapSuccessBackground:#11331a;--sapInformationBackground:#00144a;--sapNeutralBackground:#242e38;
  --sapErrorBorderColor:#fa6161;--sapWarningBorderColor:#f7bf00;--sapSuccessBorderColor:#6dad1f;--sapInformationBorderColor:#4db1ff;--sapNeutralBorderColor:#a9b4be;
  --sapButton_Background:#1c242c;--sapButton_BorderColor:#3a4a5a;--sapButton_TextColor:#4db1ff;--sapButton_Hover_Background:#222b35;
  --sapButton_Selected_Background:#002643;--sapButton_Selected_TextColor:#4db1ff;
  --sapField_Background:#161c22;--sapField_BorderColor:#a9b4be;--sapField_Focus_BorderColor:#9ad3ff;
  --sapGroup_ContentBorderColor:#323c48;--sapList_BorderColor:#2e3742;--sapList_Background:#1d232a;--sapList_HeaderBackground:#1d232a;
  --sapList_Hover_Background:#222b35;--sapList_SelectionBackgroundColor:#1d2d3e;--sapList_SelectionBorderColor:#4db1ff;--sapList_AlternatingBackground:#12171c;
  --sapTile_Background:#1d232a;--sapContent_MarkerTextColor:#64edd2;--sapContent_SearchHighlightColor:#046c7a;
  --sapIndication5:#a6e0ff;--sapIndication6:#64edd2;--sapIndication7:#d3b6ff;--sapIndication8:#ff8af0;--sapIndication3:#ffc933;--sapIndication4:#bde986;
  --sapAccent5:#d3b6ff;--sapAccentBg5:#470cf1;--sapAccent7:#64edd2;--sapAccentBg7:#036573;--sapAccent1:#ffdf72;--sapAccentBg1:#ae4000;--sapAccent6:#a6e0ff;--sapAccentBg6:#0054cc;
  --ill2:#4d82b8;--ill4:#688fb7;--ill5:#fff;--ill6:#818f98;--ill7:#101619;--ill8:#d5dadd;--ill13:#3b5b7c;--ill14:#2a4259;--ill18:#2a4259;--ill19:#324e6b;--ill20:#222f3b;--ill21:#101619;--ill24:#d094b0;--ill26:#d0b863;--ill27:#d0cdb3;
  --code-bg:#12171c;--code-border:#323c48;--code-kw:#4db1ff;--code-str:#97dd40;--code-tpl:#64edd2;--code-cmt:#8396a8;--code-num:#ff8af0;--code-type:#ffafed;--code-hl:#382700;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--sapBackgroundColor);color:var(--sapTextColor);font-family:var(--font);font-size:.875rem;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--sapShellColor)}
a{color:var(--sapLinkColor);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:.125rem solid var(--sapContent_FocusColor);outline-offset:.0625rem;border-radius:.25rem}
h1,h2,h3,h4{color:var(--sapTitleColor);text-wrap:balance;margin:0;font-weight:700}
p{margin:0}
code,kbd{font-family:var(--mono);font-size:.8125rem}
:not(pre)>code{background:var(--sapNeutralBackground);border-radius:.25rem;padding:.0625rem .3125rem;white-space:nowrap}
.ic{font-family:"SAP-icons";font-style:normal;font-weight:400;line-height:1;speak:none;display:inline-block;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell bar ---------- */
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:3.25rem;background:var(--sapShellColor);box-shadow:var(--sapShell_Shadow);
  display:flex;align-items:center;gap:.5rem;padding-left:max(.5rem,env(safe-area-inset-left,0px));padding-right:max(.5rem,env(safe-area-inset-right,0px))}
.shell .brand{display:flex;align-items:center;gap:.625rem;color:var(--sapTextColor);text-decoration:none;padding:.25rem .5rem;border-radius:var(--r-btn);min-width:0}
.shell .brand:hover{background:var(--sapButton_Hover_Background);text-decoration:none}
.logo{width:2rem;height:2rem;flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-t b{font-size:1rem;font-weight:700;white-space:nowrap}
.brand-t span{font-size:.75rem;color:var(--sapContent_LabelColor);white-space:nowrap}
.shell .spacer{flex:1}
.ibtn{width:2.25rem;height:2.25rem;border-radius:var(--r-btn);border:0;background:transparent;color:var(--sapTextColor);cursor:pointer;display:inline-grid;place-items:center;font-size:1rem;flex:none}
.ibtn:hover{background:var(--sapButton_Hover_Background)}
.search{position:relative;width:min(22rem,40vw)}
.search input{width:100%;height:2.25rem;border-radius:1.125rem;border:1px solid var(--sapField_BorderColor);background:var(--sapField_Background);color:var(--sapTextColor);
  font:inherit;padding:0 2.25rem 0 1rem}
.search input:focus{outline:.125rem solid var(--sapField_Focus_BorderColor);outline-offset:0;border-color:transparent}
.search .ic{position:absolute;right:.875rem;top:50%;transform:translateY(-50%);color:var(--sapContent_LabelColor);pointer-events:none}
.sresults{position:absolute;top:calc(100% + .375rem);left:0;right:0;background:var(--sapBaseColor);border-radius:var(--r-el);box-shadow:var(--sapContent_Shadow2);padding:.375rem;max-height:60vh;overflow:auto;z-index:70}
.sresults a{display:flex;flex-direction:column;padding:.5rem .75rem;border-radius:.5rem;color:var(--sapTextColor)}
.sresults a:hover,.sresults a.cur{background:var(--sapList_Hover_Background);text-decoration:none}
.sresults small{color:var(--sapContent_LabelColor)}
.sresults .none{padding:.75rem;color:var(--sapContent_LabelColor)}
.prog-chip{display:flex;align-items:center;gap:.5rem;padding:0 .5rem;font-size:.75rem;color:var(--sapContent_LabelColor);white-space:nowrap}
.ring{width:1.75rem;height:1.75rem}
.menu-btn{display:none}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:17rem minmax(0,1fr);min-height:calc(100vh - 3.25rem)}
.sidenav{position:sticky;top:calc(3.25rem + env(safe-area-inset-top,0px));height:calc(100vh - 3.25rem - env(safe-area-inset-top,0px));overflow:auto;background:var(--sapShellColor);
  border-right:1px solid var(--sapGroup_ContentBorderColor);padding:.75rem .5rem 2rem;padding-left:max(.5rem,env(safe-area-inset-left,0px))}
.nav-group{margin-top:.75rem}
.nav-group>button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:.5rem;width:100%;padding:.5rem .75rem;border-radius:.5rem;font-weight:700;font-size:.8125rem;color:var(--sapTextColor)}
.nav-group>button:hover{background:var(--sapList_Hover_Background)}
.nav-group>button:focus-visible{outline:.125rem solid var(--sapContent_FocusColor)}
.nav-group>button .chev{margin-left:auto;font-size:.75rem;color:var(--sapContent_LabelColor);transition:transform .15s}
.nav-group.closed>button .chev{transform:rotate(-90deg)}
.nav-group.closed ul{display:none}
.nav-group small{display:block;font-weight:400;color:var(--sapContent_LabelColor);font-size:.6875rem;letter-spacing:.02em}
.sidenav ul{list-style:none;margin:.125rem 0 0;padding:0}
.nav-item{display:flex;align-items:center;gap:.625rem;padding:.4375rem .75rem .4375rem .875rem;border-radius:.5rem;color:var(--sapTextColor);font-size:.875rem;line-height:1.3;position:relative}
.nav-item:hover{background:var(--sapList_Hover_Background);text-decoration:none}
.nav-item.active{background:var(--sapList_SelectionBackgroundColor);color:var(--sapSelectedColor);font-weight:700}
.nav-item.active::before{content:"";position:absolute;left:.25rem;top:.5rem;bottom:.5rem;width:.1875rem;border-radius:.125rem;background:var(--sapSelectedColor)}
.nav-item .num{font-family:var(--mono);font-size:.6875rem;color:var(--sapContent_LabelColor);width:1.25rem;flex:none;text-align:right}
.nav-item.active .num{color:var(--sapSelectedColor)}
.nav-item .done{margin-left:auto;color:var(--sapPositiveColor);font-size:.75rem}
.nav-top{display:flex;align-items:center;gap:.625rem}
.nav-top .ic{width:1.25rem;text-align:center;color:var(--sapContent_LabelColor)}
.nav-item.active .ic{color:var(--sapSelectedColor)}
.scrim{display:none}

main{min-width:0;padding-bottom:4rem}
.page{animation:fade .2s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(.25rem)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Object page header ---------- */
.oph{background:var(--sapObjectHeader_Background,var(--sapBaseColor));background:var(--sapBaseColor);box-shadow:var(--sapShell_Shadow)}
.oph-in,.wrap{max-width:68rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.oph-in{padding-block:1rem 1.25rem;display:flex;gap:1.5rem;align-items:flex-start}
.oph-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:.5rem}
.crumbs{display:flex;flex-wrap:wrap;gap:.375rem;font-size:.8125rem;color:var(--sapContent_LabelColor)}
.crumbs a{color:var(--sapLinkColor)}
.oph h1{font-size:1.625rem;line-height:1.2}
.oph .sub{color:var(--sapContent_LabelColor);font-size:.9375rem;max-width:62ch}
.attrs{display:flex;flex-wrap:wrap;gap:.5rem 2rem;margin-top:.5rem}
.attr{display:flex;flex-direction:column;gap:.125rem}
.attr span{font-size:.75rem;color:var(--sapContent_LabelColor)}
.attr b{font-weight:600}
.oph-act{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.avatar{width:4.5rem;height:4.5rem;border-radius:1rem;flex:none;display:grid;place-items:center;font-size:2rem}
.anchors{display:flex;gap:.25rem;overflow-x:auto;border-top:1px solid var(--sapList_BorderColor);scrollbar-width:none}
.anchors a{padding:.75rem .75rem .6875rem;color:var(--sapContent_LabelColor);font-weight:600;font-size:.875rem;white-space:nowrap;border-bottom:.1875rem solid transparent}
.anchors a:hover{color:var(--sapTextColor);text-decoration:none}
.anchors a.on{color:var(--sapSelectedColor);border-bottom-color:var(--sapSelectedColor)}

/* ---------- Content ---------- */
.body{display:flex;flex-direction:column;gap:1.5rem;padding-block:1.5rem 0}
.sec{display:flex;flex-direction:column;gap:.875rem;scroll-margin-top:4.5rem}
.sec>h2{font-size:1.25rem;display:flex;align-items:center;gap:.625rem}
.sec>h2 .ic{color:var(--sapBrandColor);font-size:1.125rem}
.sec h3{font-size:1rem;margin-top:.25rem}
.prose{display:flex;flex-direction:column;gap:.75rem;max-width:72ch;font-size:.9375rem;line-height:1.6}
.prose ul,.prose ol{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:.375rem}
.card{background:var(--sapTile_Background);border-radius:var(--r-el);box-shadow:var(--sapContent_Shadow0);padding:1.25rem;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:.75rem;padding:.875rem 1.25rem;border-bottom:1px solid var(--sapList_BorderColor)}
.card-h h3{font-size:1rem;margin:0}
.card-h .ic{color:var(--sapBrandColor)}
.card-h p{color:var(--sapContent_LabelColor);font-size:.8125rem}
.card-b{padding:1.25rem;display:flex;flex-direction:column;gap:1rem;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:1rem}
.obj{display:flex;flex-direction:column;gap:.25rem}
.obj ul{margin:0;padding-left:1.125rem}
.objectives{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:.5rem 1.5rem}
.objectives li{display:flex;gap:.625rem;align-items:flex-start}
.objectives .ic{color:var(--sapPositiveColor);margin-top:.1875rem}
.lead{font-size:1rem;line-height:1.6;max-width:70ch}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:.375rem 1rem;font-size:.875rem}
.kv dt{color:var(--sapContent_LabelColor)}
.kv dd{margin:0;min-width:0}
.kv code{white-space:normal}
@media (max-width:520px){.kv{grid-template-columns:minmax(0,1fr);gap:.125rem}.kv dd{margin-bottom:.5rem}}

/* Message strip */
.strip{display:flex;gap:.75rem;align-items:flex-start;padding:.625rem 1rem;border-radius:var(--r-el);border:1px solid var(--sapInformationBorderColor);background:var(--sapInformationBackground);font-size:.875rem;max-width:80ch}
.strip>.ic{margin-top:.1875rem;color:var(--sapInformativeColor)}
.strip.ok{border-color:var(--sapSuccessBorderColor);background:var(--sapSuccessBackground)}.strip.ok>.ic{color:var(--sapPositiveColor)}
.strip.warn{border-color:var(--sapWarningBorderColor);background:var(--sapWarningBackground)}.strip.warn>.ic{color:var(--sapCriticalColor)}
.strip.err{border-color:var(--sapErrorBorderColor);background:var(--sapErrorBackground)}.strip.err>.ic{color:var(--sapNegativeColor)}

/* Buttons & fields */
.btn{font:inherit;font-weight:600;font-size:.875rem;height:2.25rem;padding:0 .875rem;border-radius:var(--r-btn);border:1px solid var(--sapButton_BorderColor);background:var(--sapButton_Background);color:var(--sapButton_TextColor);
  cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap}
.btn:hover{background:var(--sapButton_Hover_Background)}
.btn.emph{background:var(--sapButton_Emphasized_Background);border-color:var(--sapButton_Emphasized_Background);color:#fff}
.btn.emph:hover{background:var(--sapButton_Emphasized_Hover_Background)}
.btn.trans{border-color:transparent;background:transparent}
.btn.trans:hover{background:var(--sapButton_Hover_Background)}
.btn.ok{color:var(--sapPositiveColor);border-color:var(--sapSuccessBorderColor);background:var(--sapSuccessBackground)}
.btn.neg{color:var(--sapNegativeColor)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{height:1.75rem;padding:0 .625rem;font-size:.8125rem}
.seg{display:inline-flex;border:1px solid var(--sapButton_BorderColor);border-radius:var(--r-btn);overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-weight:600;font-size:.8125rem;border:0;background:var(--sapButton_Background);color:var(--sapButton_TextColor);padding:.4375rem .75rem;cursor:pointer;border-right:1px solid var(--sapButton_BorderColor)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--sapButton_Hover_Background)}
.seg button[aria-pressed="true"]{background:var(--sapButton_Selected_Background);color:var(--sapButton_Selected_TextColor);box-shadow:inset 0 -.125rem 0 var(--sapButton_Selected_TextColor)}
.field{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.field label,.lbl{font-size:.75rem;color:var(--sapContent_LabelColor)}
.in,select.in{font:inherit;font-size:.875rem;height:2.25rem;padding:0 .625rem;border:1px solid var(--sapField_BorderColor);border-radius:var(--r-field);background:var(--sapField_Background);color:var(--sapTextColor);min-width:0;width:100%}
.in:focus{outline:.125rem solid var(--sapField_Focus_BorderColor);outline-offset:-.0625rem}
.in.mono{font-family:var(--mono)}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end}
.row>.field{flex:1 1 9rem}
.check{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;font-size:.875rem}
.check input{width:1.125rem;height:1.125rem;accent-color:var(--sapBrandColor)}

/* Tags / object status */
.tag{display:inline-flex;align-items:center;gap:.3125rem;font-size:.75rem;font-weight:700;padding:.0625rem .5rem;border-radius:.5rem;background:var(--sapNeutralBackground);color:var(--sapContent_LabelColor);white-space:nowrap}
.tag.info{background:var(--sapInformationBackground);color:var(--sapInformativeColor)}
.tag.ok{background:var(--sapSuccessBackground);color:var(--sapPositiveColor)}
.tag.warn{background:var(--sapWarningBackground);color:var(--sapCriticalColor)}
.tag.err{background:var(--sapErrorBackground);color:var(--sapNegativeColor)}
.tag.c5{background:var(--sapAccentBg5);color:var(--sapAccent5)}
.tag.c7{background:var(--sapAccentBg7);color:var(--sapAccent7)}

/* Code */
.code{border:1px solid var(--code-border);border-radius:var(--r-el);background:var(--code-bg);overflow:hidden;min-width:0}
.code-h{display:flex;align-items:center;gap:.5rem;padding:.375rem .5rem .375rem .875rem;border-bottom:1px solid var(--code-border);font-size:.75rem;color:var(--sapContent_LabelColor)}
.code-h b{font-weight:700;color:var(--sapTextColor);font-family:var(--mono);font-size:.75rem}
.code-h .btn{margin-left:auto}
.code pre{margin:0;padding:.875rem 1rem;overflow-x:auto;font-family:var(--mono);font-size:.8125rem;line-height:1.6;tab-size:2}
.k{color:var(--code-kw);font-weight:700}.s{color:var(--code-str)}.tp{color:var(--code-tpl)}.c{color:var(--code-cmt);font-style:italic}.n{color:var(--code-num)}.y{color:var(--code-type)}
.hl{background:var(--code-hl);display:inline-block;min-width:100%;border-radius:.125rem}
.ln-run{background:var(--sapList_SelectionBackgroundColor);box-shadow:inset .1875rem 0 0 var(--sapSelectedColor);display:inline-block;min-width:100%}

/* Tables */
.tbl-wrap{overflow-x:auto;min-width:0}
table.t{border-collapse:collapse;width:100%;font-size:.875rem;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-weight:700;font-size:.75rem;color:var(--sapContent_LabelColor);padding:.5rem .75rem;border-bottom:1px solid var(--sapList_BorderColor);white-space:nowrap;background:var(--sapList_HeaderBackground)}
table.t td{padding:.5rem .75rem;border-bottom:1px solid var(--sapList_BorderColor);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--sapList_Hover_Background)}
table.t td.num,table.t th.num{text-align:right}
table.t .mono{font-family:var(--mono);font-size:.8125rem}
.empty{padding:1.5rem;text-align:center;color:var(--sapContent_LabelColor)}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:1rem}
.q{display:flex;flex-direction:column;gap:.625rem}
.q p.qt{font-weight:600;font-size:.9375rem}
.opts{display:flex;flex-direction:column;gap:.375rem}
.opt{display:flex;gap:.75rem;align-items:flex-start;padding:.625rem .875rem;border:1px solid var(--sapList_BorderColor);border-radius:.5rem;cursor:pointer;background:var(--sapList_Background);text-align:left;font:inherit;color:inherit;width:100%}
.opt:hover{background:var(--sapList_Hover_Background)}
.opt .dot{width:1.125rem;height:1.125rem;border-radius:50%;border:1px solid var(--sapField_BorderColor);flex:none;margin-top:.0625rem;display:grid;place-items:center;font-size:.625rem}
.opt.sel{border-color:var(--sapList_SelectionBorderColor);background:var(--sapList_SelectionBackgroundColor)}
.opt.sel .dot{border:.3125rem solid var(--sapSelectedColor)}
.opt.right{border-color:var(--sapSuccessBorderColor);background:var(--sapSuccessBackground)}
.opt.right .dot{border:0;background:var(--sapPositiveColor);color:var(--sapBaseColor)}
.opt.wrong{border-color:var(--sapErrorBorderColor);background:var(--sapErrorBackground)}
.opt.wrong .dot{border:0;background:var(--sapNegativeColor);color:var(--sapBaseColor)}
.opt[disabled]{cursor:default}
.q .why{font-size:.875rem;color:var(--sapContent_LabelColor);padding-left:.25rem}
.qsep{height:1px;background:var(--sapList_BorderColor)}

/* Tiles (launchpad) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));gap:1rem}
.tile{background:var(--sapTile_Background);border-radius:var(--r-tile);box-shadow:var(--sapContent_Shadow0);padding:1rem;display:flex;flex-direction:column;gap:.5rem;color:var(--sapTextColor);min-height:11rem;transition:box-shadow .15s}
.tile:hover{box-shadow:var(--sapContent_Shadow2);text-decoration:none}
.tile h3{font-size:1rem}
.tile p{color:var(--sapContent_LabelColor);font-size:.8125rem}
.tile .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:.5rem}
.tile .kpi{font-size:2rem;font-weight:300;line-height:1;color:var(--sapIndication5)}
.tile .kpi small{font-size:.875rem;color:var(--sapContent_LabelColor);font-weight:400}
.bar{height:.375rem;border-radius:.1875rem;background:var(--sapNeutralBackground);overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--sapPositiveColor);border-radius:.1875rem;transition:width .3s}

/* Hero */
.hero{background:var(--sapBaseColor);box-shadow:var(--sapShell_Shadow)}
.hero-in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:2rem;align-items:center;padding-block:2rem 2.25rem}
.hero h1{font-size:clamp(1.75rem,3.2vw,2.5rem);line-height:1.1;letter-spacing:-.01em}
.hero .eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sapContent_MarkerTextColor)}
.hero p.lead{color:var(--sapContent_LabelColor)}
.hero-c{display:flex;flex-direction:column;gap:1rem}
.hero-act{display:flex;gap:.5rem;flex-wrap:wrap}
.illu{width:100%;height:auto;max-width:100%;display:block}
.illu text{font-family:var(--font)}
.figure{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.figure figcaption{font-size:.8125rem;color:var(--sapContent_LabelColor)}
.svg-scroll{overflow-x:auto}
.svg-scroll>.illu{min-width:34rem}
.obj>.tag,.card>.tag{align-self:flex-start}

/* Widgets */
.console{background:var(--code-bg);border:1px solid var(--code-border);border-radius:.5rem;font-family:var(--mono);font-size:.8125rem;padding:.75rem 1rem;min-height:4.5rem;white-space:pre-wrap;word-break:break-word}
.console .p{color:var(--sapContent_LabelColor)}
.result{font-family:var(--mono);font-size:1rem;padding:.75rem 1rem;border-radius:.5rem;background:var(--sapNeutralBackground);word-break:break-all}
.cells{display:inline-flex;gap:.125rem;flex-wrap:wrap}
.cells span{display:inline-grid;place-items:center;width:1.5rem;height:1.75rem;border:1px solid var(--sapGroup_ContentBorderColor);border-radius:.25rem;font-family:var(--mono);font-size:.8125rem;background:var(--sapBaseColor)}
.cells span.blank{color:var(--sapContent_LabelColor);background:var(--sapNeutralBackground)}
.cells span.cut{text-decoration:line-through;color:var(--sapNegativeColor);border-style:dashed}
.note{font-size:.8125rem;color:var(--sapContent_LabelColor)}
.heap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:1rem}
.mem{border:1px dashed var(--sapGroup_ContentBorderColor);border-radius:.75rem;padding:.75rem;display:flex;flex-direction:column;gap:.5rem;min-height:9rem}
.mem>b{font-size:.75rem;color:var(--sapContent_LabelColor);text-transform:uppercase;letter-spacing:.06em}
.refv{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-family:var(--mono);font-size:.8125rem;padding:.375rem .625rem;border-radius:.5rem;background:var(--sapNeutralBackground)}
.inst{border-radius:.75rem;padding:.625rem .75rem;background:var(--sapInformationBackground);border:1px solid var(--sapInformationBorderColor);font-family:var(--mono);font-size:.75rem;display:flex;flex-direction:column;gap:.125rem;animation:pop .25s ease-out}
.inst.gone{opacity:.35;border-style:dashed}
.inst b{font-family:var(--font);font-size:.8125rem}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.5rem}
.slots{display:flex;flex-wrap:wrap;gap:.375rem}
.slot{min-width:2.75rem;padding:.375rem .5rem;border-radius:.5rem;border:1px solid var(--sapGroup_ContentBorderColor);background:var(--sapBaseColor);font-family:var(--mono);font-size:.8125rem;text-align:center;display:flex;flex-direction:column;gap:.125rem}
.slot small{font-size:.625rem;color:var(--sapContent_LabelColor)}
.slot.hit{border-color:var(--sapSuccessBorderColor);background:var(--sapSuccessBackground)}
.slot.probe{border-color:var(--sapWarningBorderColor);background:var(--sapWarningBackground)}
.slot.new{animation:pop .3s ease-out;border-color:var(--sapInformationBorderColor)}
.buckets{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.5rem,1fr));gap:.375rem}
.bucket{border:1px dashed var(--sapGroup_ContentBorderColor);border-radius:.5rem;padding:.25rem;min-height:3.5rem;display:flex;flex-direction:column;gap:.25rem;align-items:stretch}
.bucket>small{font-size:.625rem;color:var(--sapContent_LabelColor);text-align:center}
.layers{display:flex;flex-direction:column;gap:.375rem}
.layer{display:flex;align-items:center;gap:.75rem;padding:.625rem .875rem;border-radius:.75rem;border:1px solid var(--sapList_BorderColor);background:var(--sapList_Background);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.layer:hover{background:var(--sapList_Hover_Background)}
.layer.on{border-color:var(--sapList_SelectionBorderColor);background:var(--sapList_SelectionBackgroundColor)}
.layer .lic{width:2.25rem;height:2.25rem;border-radius:.625rem;display:grid;place-items:center;flex:none;font-size:1rem;color:#fff}
.layer b{display:block}
.layer small{color:var(--sapContent_LabelColor)}
.flowbox{display:flex;align-items:stretch;gap:.5rem;flex-wrap:wrap}
.fbox{flex:1 1 10rem;border:1px solid var(--sapList_BorderColor);border-radius:.75rem;padding:.75rem;display:flex;flex-direction:column;gap:.375rem;min-width:0;background:var(--sapList_Background)}
.fbox.live{border-color:var(--sapInformationBorderColor);box-shadow:0 0 0 .125rem var(--sapInformationBackground)}
.fbox h4{font-size:.8125rem;display:flex;align-items:center;gap:.375rem}
.fio{display:flex;flex-direction:column;gap:.375rem}
.fio-bar{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;padding:.75rem 1rem;background:var(--sapBaseColor);border-bottom:1px solid var(--sapList_BorderColor)}
.fio-title{font-size:1rem;font-weight:700;padding:.75rem 1rem .25rem}
.mini-shell{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;background:var(--sapShellColor);box-shadow:var(--sapShell_Shadow);font-weight:700;font-size:.8125rem}
.preview{border:1px solid var(--sapGroup_ContentBorderColor);border-radius:var(--r-el);overflow:hidden;background:var(--sapBackgroundColor)}
.chart text{font-family:var(--font);font-size:11px;fill:var(--sapContent_LabelColor)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.8125rem}
.legend span{display:inline-flex;align-items:center;gap:.375rem}
.legend i{width:.75rem;height:.1875rem;border-radius:.125rem;display:inline-block}
.uml text{font-family:var(--font)}
.pager{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:.5rem}
.pager a{flex:1 1 14rem;display:flex;flex-direction:column;gap:.125rem;padding:.875rem 1rem;border-radius:var(--r-el);background:var(--sapTile_Background);box-shadow:var(--sapContent_Shadow0);color:var(--sapTextColor)}
.pager a:hover{box-shadow:var(--sapContent_Shadow1);text-decoration:none}
.pager a small{color:var(--sapContent_LabelColor);font-size:.75rem}
.pager a.next{text-align:right}
.links{display:flex;flex-direction:column;gap:.375rem;margin:0;padding:0;list-style:none}
.links li{display:flex;gap:.5rem;align-items:baseline}
.links .ic{color:var(--sapContent_LabelColor);font-size:.75rem}
.foot{color:var(--sapContent_LabelColor);font-size:.75rem}
footer.site{margin-top:3rem;padding-block:1.5rem;border-top:1px solid var(--sapGroup_ContentBorderColor);color:var(--sapContent_LabelColor);font-size:.8125rem;display:flex;flex-direction:column;gap:.375rem}
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sapTextColor);color:var(--sapBaseColor);padding:.625rem 1rem;border-radius:.5rem;font-size:.875rem;z-index:90;box-shadow:var(--sapContent_Shadow2)}
.steps{display:flex;gap:.25rem;flex-wrap:wrap;counter-reset:st}
.score{font-size:2.5rem;font-weight:300;line-height:1}
.ref-cat{font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--sapContent_MarkerTextColor)}

/* Trilha (mapa) */
.trail{list-style:none;margin:.25rem 0 0;padding:0;display:flex;flex-direction:column}
.trail li{position:relative}
.trail li:not(:last-child)::after{content:"";position:absolute;left:.6875rem;top:1.75rem;bottom:-.25rem;width:.125rem;background:var(--sapGroup_ContentBorderColor)}
.trail li.ok:not(:last-child)::after{background:var(--sapPositiveColor)}
.trail a{display:flex;gap:.75rem;align-items:flex-start;padding:.375rem .5rem .375rem 0;border-radius:.5rem;color:var(--sapTextColor)}
.trail a:hover{text-decoration:none;background:var(--sapList_Hover_Background)}
.trail .node{width:1.5rem;height:1.5rem;border-radius:50%;border:.125rem solid var(--sapGroup_ContentBorderColor);background:var(--sapBaseColor);flex:none;display:grid;place-items:center;font-family:"SAP-icons";font-size:.625rem;color:var(--sapBaseColor);position:relative;z-index:1}
.trail li.ok .node{background:var(--sapPositiveColor);border-color:var(--sapPositiveColor)}
.trail b{display:block;font-weight:600;font-size:.875rem}
.trail small{color:var(--sapContent_LabelColor);font-size:.75rem}
.wid{display:flex;flex-direction:column;gap:1rem;padding:1.25rem;min-width:0}
.wid-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
@media (max-width:760px){.wid-split{grid-template-columns:minmax(0,1fr)}}
.statusline{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.vis{font-family:var(--mono);background:var(--sapNeutralBackground);border-radius:.25rem;padding:.125rem .375rem;white-space:pre-wrap;word-break:break-all}
.vis i{color:var(--sapContent_LabelColor);font-style:normal}
.chips{display:flex;gap:.375rem;flex-wrap:wrap}
.chip{font:inherit;font-size:.75rem;font-family:var(--mono);border:1px solid var(--sapButton_BorderColor);background:var(--sapButton_Background);color:var(--sapButton_TextColor);border-radius:1rem;padding:.1875rem .625rem;cursor:pointer}
.chip:hover{background:var(--sapButton_Hover_Background)}
.panel3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
@media (max-width:860px){.panel3{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--sapList_BorderColor);border-radius:.75rem;padding:.75rem;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.panel h4{font-size:.8125rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center;flex-wrap:wrap}
.log{font-family:var(--mono);font-size:.75rem;display:flex;flex-direction:column;gap:.25rem;max-height:10rem;overflow:auto}
.log div{padding:.25rem .5rem;border-radius:.375rem;background:var(--sapNeutralBackground)}
.fio-table td,.fio-table th{font-size:.8125rem}
.frow{display:grid;grid-template-columns:minmax(7rem,1.4fr) 1fr 4.5rem 4rem 3rem 2.25rem;gap:.5rem;align-items:center}
@media (max-width:640px){.frow{grid-template-columns:1fr 1fr;}.frow .hd{display:none}}
.frow .hd{font-size:.75rem;color:var(--sapContent_LabelColor)}
input[type=range]{accent-color:var(--sapBrandColor);width:100%}

/* ---------- Responsive ---------- */
@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-grid}
  .sidenav{position:fixed;top:calc(3.25rem + env(safe-area-inset-top,0px));left:0;bottom:0;height:auto;width:min(19rem,86vw);z-index:45;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--sapContent_Shadow2);padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))}
  body.nav-open .sidenav{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35)}
  .hero-in{grid-template-columns:minmax(0,1fr)}
  .hero-art{max-width:26rem}
  .heap{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .search{display:none}
  .search.show{display:block;position:absolute;left:.5rem;right:.5rem;top:.5rem;width:auto;z-index:80}
  .brand-t span{display:none}
  .prog-chip span{display:none}
  .oph-in{flex-direction:column;gap:.75rem}
  .avatar{display:none}
  .oph-act{justify-content:flex-start}
  .oph h1{font-size:1.375rem}
}
@media (min-width:641px){.search-btn{display:none}}

<template id="L-primeiros-passos">
<section class="sec" id="s-abap-cloud" data-anchor="ABAP Cloud">
  <h2><span class="ic" aria-hidden="true">&#xe21d;</span>O que muda com o ABAP Cloud</h2>
  <div class="prose">
    <p>ABAP é a linguagem de negócio da SAP. Hoje ela roda em três cenários: o <b>SAP BTP, ABAP environment</b> (conhecido como “Steampunk”), o <b>SAP S/4HANA Cloud Public Edition</b> e o S/4HANA privado ou on-premise. A trilha <i>Acquiring Core ABAP Skills</i> ensina o modelo <b>ABAP Cloud</b>, que vale para todos eles.</p>
    <p>No ABAP Cloud você programa com a versão de linguagem <b>ABAP for Cloud Development</b>: um subconjunto moderno da linguagem, que só usa APIs liberadas (<i>released</i>) pela SAP. Isso mantém o núcleo do sistema limpo (<i>clean core</i>) e torna as extensões seguras para upgrade.</p>
  </div>

<section class="sec" id="s-setup" data-anchor="Projeto e pacote">
  <h2><span class="ic" aria-hidden="true">&#xe1c9;</span>Projeto ABAP Cloud e pacote</h2>
  <div class="grid2">
    <div class="card obj">
      <h3>Passo a passo no ADT</h3>
      <ol class="prose" style="font-size:.875rem">
        <li><b>File › New › ABAP Cloud Project</b> e informe a URL do sistema (ou a chave de serviço do trial no BTP).</li>
        <li>Clique com o botão direito no projeto: <b>New › ABAP Package</b>. Nome iniciando com <code>Z</code> ou <code>Y</code>, superpacote <code>ZLOCAL</code> para estudos.</li>
        <li>Adicione o pacote aos <b>Favorite Packages</b> para encontrá-lo rápido.</li>
        <li>Crie objetos com <b>New › ABAP Class</b> e ative com <kbd>Ctrl+F3</kbd>.</li>
      </ol>
    </div>
    <div class="card obj">
      <h3>Atalhos que você vai usar todo dia</h3>
      <div class="tbl-wrap"><table class="t">
        <tbody>
          <tr><td><kbd>Ctrl+F3</kbd></td><td>Ativar objeto</td></tr>
          <tr><td><kbd>F9</kbd></td><td>Executar classe como aplicação de console</td></tr>
          <tr><td><kbd>Ctrl+Espaço</kbd></td><td>Completar código</td></tr>
          <tr><td><kbd>Ctrl+1</kbd></td><td>Quick fix (ex.: criar método)</td></tr>
          <tr><td><kbd>Shift+F1</kbd></td><td>Pretty printer (formatar)</td></tr>
          <tr><td><kbd>F2</kbd></td><td>Element info (documentação do elemento)</td></tr>
          <tr><td><kbd>Ctrl+Shift+A</kbd></td><td>Abrir objeto de desenvolvimento</td></tr>
        </tbody>
      </table></div>
    </div>
  </div>
</section>

<section class="sec" id="s-hello" data-anchor="Hello World">
  <h2><span class="ic" aria-hidden="true">&#xe09b;</span>Sua primeira classe: Hello World</h2>
  <div class="prose"><p>No ABAP Cloud não há relatórios com <code>WRITE</code>. Para ver uma saída, a classe implementa a interface <code>IF_OO_ADT_CLASSRUN</code> e escreve no console do Eclipse através do objeto <code>out</code>.</p></div>
<pre data-abap data-title="ZCL_HELLO_WORLD">CLASS zcl_hello_world DEFINITION
  PUBLIC FINAL CREATE PUBLIC.

  PUBLIC SECTION.
    INTERFACES if_oo_adt_classrun.
ENDCLASS.

CLASS zcl_hello_world IMPLEMENTATION.
  METHOD if_oo_adt_classrun~main.
    " Saída no console do ADT (F9)
    out->write( `Hello World` ).
  ENDMETHOD.
ENDCLASS.</pre>

<template id="L-tecnicas-basicas">
<section class="sec" id="s-dados" data-anchor="Objetos de dados">
  <h2><span class="ic" aria-hidden="true">&#xe080;</span>Objetos de dados e tipos</h2>
  <div class="prose">
    <p>Um <b>objeto de dados</b> é uma área de memória com nome e tipo. Você declara variáveis com <code>DATA</code>, tipos próprios com <code>TYPES</code> e valores fixos com <code>CONSTANTS</code>. A <b>declaração inline</b> <code>DATA( )</code> deixa o compilador deduzir o tipo pelo lado direito.</p>
  </div>
<pre data-abap data-title="Declarações">TYPES ty_price TYPE p LENGTH 8 DECIMALS 2.

DATA carrier   TYPE c LENGTH 3.          " texto de tamanho fixo
DATA seats     TYPE i VALUE 180.          " inteiro com valor inicial
DATA price     TYPE ty_price.
CONSTANTS c_max_seats TYPE i VALUE 300.

DATA(city)  = `Recife`.                   " string (crase)
DATA(count) = 10.                         " i
DATA(code)  = 'LH'.                       " c LENGTH 2 (aspas simples)</pre>
  <div class="card flush">
    <div class="card-h"><span class="ic">&#xe0ba;</span><div><h3>Tipos ABAP embutidos mais usados</h3><p>Valor inicial é o que a variável contém antes de qualquer atribuição.</p></div></div>
    <div class="tbl-wrap"><table class="t">
      <thead><tr><th>Tipo</th><th>Uso</th><th>Tamanho</th><th>Valor inicial</th></tr></thead>
      <tbody>
        <tr><td class="mono">i</td><td>Inteiro de 4 bytes</td><td>±2.147.483.647</td><td class="mono">0</td></tr>
        <tr><td class="mono">int8</td><td>Inteiro de 8 bytes</td><td>±9,2 × 10¹⁸</td><td class="mono">0</td></tr>
        <tr><td class="mono">p</td><td>Número decimal compactado (valores monetários)</td><td>1–16 bytes, até 14 decimais</td><td class="mono">0</td></tr>
        <tr><td class="mono">decfloat34</td><td>Ponto flutuante decimal</td><td>34 dígitos</td><td class="mono">0</td></tr>
        <tr><td class="mono">c</td><td>Texto de tamanho fixo</td><td>1–262.143 caracteres</td><td>espaços</td></tr>
        <tr><td class="mono">string</td><td>Texto de tamanho variável</td><td>dinâmico</td><td>string vazia</td></tr>
        <tr><td class="mono">n</td><td>Texto numérico (só dígitos)</td><td>1–262.143</td><td class="mono">'000…'</td></tr>
        <tr><td class="mono">d / t</td><td>Data AAAAMMDD / hora HHMMSS</td><td>8 / 6 caracteres</td><td class="mono">'00000000'</td></tr>
        <tr><td class="mono">abap_bool</td><td>Booleano (<code>abap_true</code> = 'X')</td><td>c LENGTH 1</td><td>espaço (falso)</td></tr>
      </tbody>
    </table></div>
  </div>
</section>

<section class="sec" id="s-calc" data-anchor="Cálculos">
  <h2><span class="ic" aria-hidden="true">&#xe151;</span>Expressões aritméticas</h2>
  <div class="prose">
    <p>Os operadores são <code>+ - * / **</code>, além de <code>DIV</code> (divisão inteira) e <code>MOD</code> (resto). Uma pegadinha clássica: quando o resultado vai para um inteiro, <code>/</code> <b>arredonda</b> em vez de truncar. E em ABAP o resultado de <code>MOD</code> nunca é negativo.</p>
  </div>
  <div class="card flush" data-widget="divcalc"></div>
</section>

<section class="sec" id="s-controle" data-anchor="Controle">
  <h2><span class="ic" aria-hidden="true">&#xe0c7;</span>Estruturas de controle</h2>
  <div class="grid2">
<pre data-abap data-title="Condições">IF seats > c_max_seats.
  out->write( `Lotado` ).
ELSEIF seats IS INITIAL.
  out->write( `Sem reservas` ).
ELSE.
  out->write( |Livres: { c_max_seats - seats }| ).
ENDIF.

CASE carrier.
  WHEN 'LH' OR 'LX'.
    out->write( `Grupo Lufthansa` ).
  WHEN OTHERS.
    out->write( `Outra companhia` ).
ENDCASE.</pre>
<pre data-abap data-title="Repetições">DO 3 TIMES.
  out->write( |Volta { sy-index }| ).
ENDDO.

DATA(n) = 0.
WHILE n &lt; 5.
  n += 1.
  IF n = 2.
    CONTINUE.        " pula para a próxima volta
  ENDIF.
  IF n = 4.
    EXIT.            " sai do laço
  ENDIF.
ENDWHILE.

" Condição como valor booleano
DATA(is_full) = xsdbool( seats >= c_max_seats ).</pre>
  </div>
  <div class="strip"><span class="ic">&#xe289;</span><p><b>sy-index</b> conta as voltas de <code>DO</code> e <code>WHILE</code>. Em <code>LOOP AT</code> sobre tabelas internas o contador é <b>sy-tabix</b>.</p></div>
</section>

<section class="sec" id="s-debug" data-anchor="Debugger">
  <h2><span class="ic" aria-hidden="true">&#xe22d;</span>Depurando no ADT</h2>
  <div class="grid2">
    <div class="card obj"><h3>Breakpoints</h3><p class="prose" style="font-size:.875rem">Dê duplo clique na régua à esquerda do código (ou <kbd>Ctrl+Shift+B</kbd>). Ao executar com <kbd>F9</kbd>, o ADT pergunta se deseja abrir a perspectiva <b>Debug</b>.</p></div>
    <div class="card obj"><h3>Navegação</h3>
      <dl class="kv"><dt><kbd>F5</kbd></dt><dd>Step into (entra no método)</dd><dt><kbd>F6</kbd></dt><dd>Step over (próxima instrução)</dd><dt><kbd>F7</kbd></dt><dd>Step return (volta ao chamador)</dd><dt><kbd>F8</kbd></dt><dd>Resume (até o próximo breakpoint)</dd></dl>
    </div>
  </div>
</section>
</template>

<template id="L-classes-locais">
<section class="sec" id="s-oo" data-anchor="Conceitos">
  <h2><span class="ic" aria-hidden="true">&#xe0c6;</span>Classes, objetos e encapsulamento</h2>
  <div class="prose">
    <p>Uma <b>classe</b> é o molde; um <b>objeto</b> (instância) é criado na memória a partir dele com <code>NEW</code>. Variáveis do tipo <code>REF TO</code> guardam <b>referências</b> para os objetos. Classes locais ficam dentro de uma classe global, na aba <b>Local Types</b> do ADT.</p>
    <p>Cada classe tem uma parte de <b>definição</b> (o que existe) e uma de <b>implementação</b> (como funciona). As seções <code>PUBLIC</code>, <code>PROTECTED</code> e <code>PRIVATE</code> controlam quem enxerga cada componente.</p>
  </div>
<pre data-abap data-title="Local Types · lcl_connection">CLASS lcl_connection DEFINITION.
  PUBLIC SECTION.
    CLASS-DATA conn_counter TYPE i READ-ONLY.   " estático: um por classe

    METHODS constructor
      IMPORTING i_carrier_id    TYPE /dmo/carrier_id
                i_connection_id TYPE /dmo/connection_id
      RAISING   cx_abap_invalid_value.

    METHODS get_output RETURNING VALUE(r_output) TYPE string.

  PRIVATE SECTION.
    DATA carrier_id    TYPE /dmo/carrier_id.        " instância
    DATA connection_id TYPE /dmo/connection_id.
ENDCLASS.

CLASS lcl_connection IMPLEMENTATION.
  METHOD constructor.
    IF i_carrier_id IS INITIAL OR i_connection_id IS INITIAL.
      RAISE EXCEPTION TYPE cx_abap_invalid_value.
    ENDIF.
    me->carrier_id    = i_carrier_id.
    me->connection_id = i_connection_id.
    conn_counter += 1.
  ENDMETHOD.

  METHOD get_output.
    r_output = |{ carrier_id } { connection_id }|.
  ENDMETHOD.
ENDCLASS.</pre>
</section>

<section class="sec" id="s-heap" data-anchor="Laboratório">
  <h2><span class="ic" aria-hidden="true">&#xe0d1;</span>Laboratório: referências e instâncias</h2>
  <div class="prose"><p>Crie objetos, aponte duas referências para o mesmo objeto e limpe referências. Observe que o atributo estático <code>conn_counter</code> é compartilhado, e que um objeto sem nenhuma referência é recolhido pelo <i>garbage collector</i>.</p></div>
  <div class="card flush" data-widget="objlab"></div>
</section>

<section class="sec" id="s-metodos" data-anchor="Métodos">
  <h2><span class="ic" aria-hidden="true">&#xe244;</span>Assinaturas e chamadas de métodos</h2>
  <div class="grid2">
    <div class="card obj">
      <h3>Tipos de parâmetro</h3>
      <dl class="kv">
        <dt><code>IMPORTING</code></dt><dd>Entrada; não pode ser alterado no método.</dd>
        <dt><code>EXPORTING</code></dt><dd>Saída; o chamador recebe o valor.</dd>
        <dt><code>CHANGING</code></dt><dd>Entrada e saída.</dd>
        <dt><code>RETURNING</code></dt><dd>Um único retorno, sempre <code>VALUE( )</code>. Torna o método <b>funcional</b>.</dd>
        <dt><code>RAISING</code></dt><dd>Exceções baseadas em classe que o método pode propagar.</dd>
      </dl>
    </div>
<pre data-abap data-title="Usando a classe">TRY.
    DATA(connection) = NEW lcl_connection(
                         i_carrier_id    = 'LH'
                         i_connection_id = '0400' ).

    " Chamada funcional: o retorno é usado direto
    out->write( connection->get_output( ) ).

    " Componente estático: classe=>componente
    out->write( lcl_connection=>conn_counter ).

  CATCH cx_abap_invalid_value.
    out->write( `Dados de entrada inválidos` ).
ENDTRY.</pre>
  </div>
</section>
</template>

<template id="L-ler-dados">
<section class="sec" id="s-sql" data-anchor="ABAP SQL">
  <h2><span class="ic" aria-hidden="true">&#xe080;</span>Lendo a base de dados com ABAP SQL</h2>
  <div class="prose">
    <p>ABAP SQL é o SQL integrado à linguagem. Ele é independente do banco, verificado em tempo de compilação e lê tanto tabelas do dicionário quanto <b>CDS view entities</b>. Variáveis ABAP dentro do comando levam o prefixo <code>@</code> (<i>host variables</i>).</p>
  </div>
  <div class="grid2">
<pre data-abap data-title="Uma linha">SELECT SINGLE
  FROM /dmo/connection
  FIELDS airport_from_id, airport_to_id
  WHERE carrier_id    = @i_carrier_id
    AND connection_id = @i_connection_id
  INTO ( @airport_from_id, @airport_to_id ).

IF sy-subrc &lt;> 0.
  RAISE EXCEPTION TYPE cx_abap_invalid_value.
ENDIF.</pre>
<pre data-abap data-title="Várias linhas">SELECT FROM /dmo/connection
  FIELDS carrier_id, connection_id,
         airport_from_id, airport_to_id
  WHERE carrier_id = 'LH'
  ORDER BY connection_id
  INTO TABLE @DATA(connections)
  UP TO 10 ROWS.

out->write( |Lidas: { sy-dbcnt }| ).</pre>
  </div>
  <div class="strip"><span class="ic">&#xe289;</span><p><b>sy-subrc</b> = 0 quando pelo menos uma linha foi encontrada, 4 quando nenhuma. <b>sy-dbcnt</b> traz quantas linhas foram lidas. No ADT, <kbd>F8</kbd> sobre uma tabela ou CDS abre o <b>Data Preview</b>.</p></div>
</section>

<section class="sec" id="s-builder" data-anchor="Construtor de SELECT">
  <h2><span class="ic" aria-hidden="true">&#xe076;</span>Construtor de SELECT</h2>
  <div class="prose"><p>Monte a consulta e veja o comando ABAP SQL gerado e o resultado sobre um extrato de dados de exemplo inspirado no modelo de voos <code>/DMO/</code> que a SAP usa nos cursos.</p></div>
  <div class="card flush" data-widget="sqlbuilder"></div>
</section>

<section class="sec" id="s-cdsread" data-anchor="CDS como fonte">
  <h2><span class="ic" aria-hidden="true">&#xe1d8;</span>Lendo de uma CDS view</h2>
  <div class="prose"><p>O ABAP Cloud não permite ler tabelas SAP não liberadas. Em vez disso, você lê <b>CDS views liberadas</b> (por exemplo, <code>I_Country</code>), que expõem os dados com nomes semânticos em CamelCase.</p></div>
<pre data-abap data-title="Lendo uma CDS view liberada">SELECT FROM I_Country
  FIELDS Country, CountryThreeLetterISOCode
  WHERE Country IN ('BR', 'PT', 'DE')
  INTO TABLE @DATA(countries).</pre>
</section>
</template>

<template id="L-estruturas">
<section class="sec" id="s-struct" data-anchor="Estruturas">
  <h2><span class="ic" aria-hidden="true">&#xe0ba;</span>Estruturas: vários campos, um nome</h2>
  <div class="prose"><p>Uma <b>estrutura</b> agrupa componentes de tipos diferentes, como uma linha de tabela. Você acessa cada componente com o seletor <code>-</code>. Estruturas podem ser aninhadas e podem herdar componentes com <code>INCLUDE TYPE</code>.</p></div>
  <figure class="figure card">
    <div class="svg-scroll">
    <svg class="illu" viewBox="0 0 640 170" role="img" aria-labelledby="fig5t">
      <title id="fig5t">Estrutura connection com componentes carrier_id, connection_id, airport_from_id e distance lado a lado na memória</title>
      <text x="16" y="28" class="h tx">connection</text><text x="104" y="28" class="sm tl">TYPE ty_connection</text>

        <rect width="130" height="64" rx="10" class="f18"/><text x="12" y="24" class="sm tl">carrier_id · c(3)</text><text x="12" y="48" class="mono tx" font-size="16">LH</text>
        <rect x="138" width="150" height="64" rx="10" class="f19"/><text x="150" y="24" class="sm tl">connection_id · n(4)</text><text x="150" y="48" class="mono tx" font-size="16">0400</text>
        <rect x="296" width="160" height="64" rx="10" class="f18"/><text x="308" y="24" class="sm tl">airport_from_id · c(3)</text><text x="308" y="48" class="mono tx" font-size="16">FRA</text>
        <rect x="464" width="144" height="64" rx="10" class="f20"/><text x="476" y="24" class="sm tl">distance · i</text><text x="476" y="48" class="mono tx" font-size="16">6162</text>
      </g>
      <path d="M81 122 v14 h0" class="s13" stroke-width="2"/>

      <text x="200" y="156" class="sm tl">o hífen seleciona o componente</text>
    </svg>
    </div>
  </figure>
<pre data-abap data-title="Tipos estruturados">TYPES: BEGIN OF ty_connection,
         carrier_id      TYPE /dmo/carrier_id,
         connection_id   TYPE /dmo/connection_id,
         airport_from_id TYPE /dmo/airport_from_id,
         distance        TYPE /dmo/flight_distance,
       END OF ty_connection.

DATA connection TYPE ty_connection.

connection-carrier_id = 'LH'.
connection = VALUE #( carrier_id      = 'LH'
                      connection_id   = '0400'
                      airport_from_id = 'FRA'
                      distance        = 6162 ).

" Estrutura direto do SELECT
SELECT SINGLE FROM /dmo/connection
  FIELDS carrier_id, connection_id, airport_from_id, distance

  <h2><span class="ic" aria-hidden="true">&#xe088;</span>Copiando entre estruturas diferentes</h2>
  <div class="prose"><p><code>CORRESPONDING #( )</code> copia apenas os componentes com o <b>mesmo nome</b>. Com <code>MAPPING</code> você liga nomes diferentes; com <code>EXCEPT</code> você exclui componentes. Marque as opções e veja o que chega no destino.</p></div>

<template id="L-tabelas-internas">
<section class="sec" id="s-tipos-tab" data-anchor="Tipos de tabela">
  <h2><span class="ic" aria-hidden="true">&#xe0a5;</span>Tabelas internas: standard, sorted e hashed</h2>
  <div class="prose"><p>Uma <b>tabela interna</b> guarda várias linhas do mesmo tipo na memória do programa. O tipo de tabela define como as linhas são organizadas e, por consequência, quanto custa encontrar uma linha pela chave.</p></div>
  <div class="tbl-wrap card flush"><table class="t">
    <thead><tr><th>Tipo</th><th>Organização</th><th>Chave</th><th>Leitura pela chave</th><th>Quando usar</th></tr></thead>
    <tbody>
      <tr><td><b>STANDARD</b></td><td>Ordem de inserção</td><td>NON-UNIQUE (opcional)</td><td><span class="tag warn">linear · n</span></td><td>Listas pequenas, acesso por índice, APPEND</td></tr>
      <tr><td><b>SORTED</b></td><td>Sempre ordenada pela chave</td><td>UNIQUE ou NON-UNIQUE</td><td><span class="tag info">binária · log₂ n</span></td><td>Leituras parciais pela chave, LOOP WHERE</td></tr>
      <tr><td><b>HASHED</b></td><td>Função hash, sem índice</td><td>Sempre UNIQUE</td><td><span class="tag ok">constante · 1</span></td><td>Muitas leituras pela chave completa</td></tr>
    </tbody>
  </table></div>
<pre data-abap data-title="Declarações">TYPES ty_flights TYPE STANDARD TABLE OF /dmo/flight
                 WITH NON-UNIQUE KEY carrier_id connection_id flight_date.

DATA flights  TYPE ty_flights.
DATA by_id    TYPE SORTED TABLE OF /dmo/connection
                   WITH UNIQUE KEY carrier_id connection_id.
DATA carriers TYPE HASHED TABLE OF /dmo/carrier
                   WITH UNIQUE KEY carrier_id.</pre>
</section>

<section class="sec" id="s-itablab" data-anchor="Laboratório">
  <h2><span class="ic" aria-hidden="true">&#xe1b7;</span>Laboratório: inserir e ler pela chave</h2>
  <div class="prose"><p>Insira chaves e depois procure uma delas. Compare como cada tipo guarda as linhas, o que acontece com duplicatas e quantas comparações a leitura precisa.</p></div>
  <div class="card flush" data-widget="itab"></div>
</section>

<section class="sec" id="s-ops" data-anchor="Operações">
  <h2><span class="ic" aria-hidden="true">&#xe244;</span>Operações essenciais</h2>
  <div class="grid2">
<pre data-abap data-title="Preencher e ler">" Preencher
APPEND VALUE #( carrier_id = 'LH' connection_id = '0400' )
       TO flights.
INSERT VALUE #( carrier_id = 'AA' connection_id = '0017' )
       INTO TABLE by_id.

" Ler uma linha (READ TABLE define sy-subrc)
READ TABLE by_id INTO DATA(conn)
     WITH TABLE KEY carrier_id = 'AA' connection_id = '0017'.

" Expressão de tabela (lança exceção se não achar)
TRY.
    DATA(lh) = by_id[ carrier_id = 'LH' connection_id = '0400' ].
  CATCH cx_sy_itab_line_not_found.
ENDTRY.

IF line_exists( by_id[ carrier_id = 'UA' ] ).
ENDIF.
DATA(total) = lines( flights ).</pre>
<pre data-abap data-title="Percorrer e alterar">" Cópia em work area
LOOP AT flights INTO DATA(flight)
     WHERE carrier_id = 'LH'.
  out->write( flight-flight_date ).
ENDLOOP.

" Acesso direto à linha com field-symbol
LOOP AT flights ASSIGNING FIELD-SYMBOL(&lt;flight>).
  &lt;flight>-price = &lt;flight>-price * '1.1'.
ENDLOOP.

SORT flights BY flight_date DESCENDING.
DELETE flights WHERE seats_occupied = 0.

" Construir tabela a partir de outra
DATA(dates) = VALUE string_table(
  FOR f IN flights ( CONV string( f-flight_date ) ) ).</pre>
  </div>
</section>
</template>

<template id="L-business-objects">
<section class="sec" id="s-bo" data-anchor="Business objects">
  <h2><span class="ic" aria-hidden="true">&#xe011;</span>Por que não usar UPDATE direto?</h2>
  <div class="prose">
    <p>No ABAP Cloud, dados de negócio pertencem a <b>business objects RAP</b>. Um BO junta validações, determinações, autorizações e bloqueios. Se você escrever na tabela com <code>UPDATE</code> você pula todas essas regras. Por isso as alterações passam pela <b>EML</b> (<i>Entity Manipulation Language</i>).</p>
    <p>A EML trabalha em duas fases: <code>MODIFY ENTITIES</code> grava no <b>buffer transacional</b>; <code>COMMIT ENTITIES</code> valida e persiste tudo de uma vez no banco (a SAP LUW).</p>
  </div>
  <div class="card flush" data-widget="eml"></div>
</section>

<section class="sec" id="s-eml" data-anchor="Sintaxe EML">
  <h2><span class="ic" aria-hidden="true">&#xe244;</span>Sintaxe EML</h2>
  <div class="grid2">
<pre data-abap data-title="Ler e alterar">READ ENTITIES OF /dmo/r_agencytp
  ENTITY /dmo/agency
  FIELDS ( name city ) WITH
    VALUE #( ( agencyid = '070050' ) )
  RESULT DATA(agencies)
  FAILED DATA(failed_read).

MODIFY ENTITIES OF /dmo/r_agencytp
  ENTITY /dmo/agency
  UPDATE FIELDS ( name ) WITH
    VALUE #( ( agencyid = '070050'
               name     = 'Agência Recife' ) )
  FAILED DATA(failed)
  REPORTED DATA(reported).</pre>
<pre data-abap data-title="Gravar">COMMIT ENTITIES
  RESPONSE OF /dmo/r_agencytp
  FAILED   DATA(failed_commit)
  REPORTED DATA(reported_commit).

IF failed_commit IS INITIAL.
  out->write( `Agência atualizada` ).
ELSE.
  " Mensagens de validação ficam em reported_commit
  ROLLBACK ENTITIES.
ENDIF.</pre>
  </div>
  <div class="strip warn"><span class="ic">&#xe201;</span><p>Dentro de implementações de comportamento (behavior pool) você <b>não</b> chama <code>COMMIT ENTITIES</code>: quem controla a transação é o framework RAP.</p></div>
</section>
</template>

<template id="L-rap">
<section class="sec" id="s-camadas" data-anchor="Camadas">
  <h2><span class="ic" aria-hidden="true">&#xe0cf;</span>As camadas de uma aplicação RAP</h2>
  <div class="prose"><p>O <b>ABAP RESTful Application Programming Model</b> organiza uma aplicação Fiori em camadas, da tabela ao navegador. Clique em cada camada para ver o artefato correspondente.</p></div>
  <div class="card flush" data-widget="rap"></div>
</section>

<section class="sec" id="s-comport" data-anchor="Comportamento">
  <h2><span class="ic" aria-hidden="true">&#xe0e5;</span>Comportamento transacional</h2>
  <div class="grid3">
    <div class="card obj"><span class="tag c5">Managed</span><p>O framework implementa create, update, delete e bloqueios. Você só adiciona a lógica específica. É o caminho para aplicações novas.</p></div>
    <div class="card obj"><span class="tag c7">Unmanaged</span><p>Você implementa a persistência, geralmente reaproveitando código legado (BAPIs, funções de update).</p></div>
    <div class="card obj"><span class="tag info">Draft</span><p>Salva rascunhos no servidor enquanto o usuário edita, com tabela própria de rascunho e ações <code>Edit</code>/<code>Activate</code>.</p></div>
  </div>
  <div class="grid2">
    <div class="card obj"><h3>Determinations</h3><p>Calculam valores automaticamente, ex.: preencher o status inicial ao criar.</p></div>
    <div class="card obj"><h3>Validations</h3><p>Verificam consistência antes de salvar, ex.: data final depois da inicial.</p></div>
    <div class="card obj"><h3>Actions</h3><p>Operações de negócio que o usuário dispara, ex.: <code>acceptTravel</code>.</p></div>
    <div class="card obj"><h3>Feature control</h3><p>Ativa ou desativa campos e botões conforme o estado do registro.</p></div>
  </div>
<pre data-abap data-lang="BDL" data-title="Behavior definition · ZR_TRAVEL">managed implementation in class zbp_r_travel unique;
strict ( 2 );

define behavior for ZR_Travel alias Travel
persistent table ztravel
lock master
authorization master ( instance )
etag master LocalLastChanged
{
  create; update; delete;
  field ( readonly, numbering : managed ) TravelUUID;

  determination setStatusNew on modify { create; }
  validation validateDates on save { create; field BeginDate, EndDate; }
  action acceptTravel result [1] $self;
}</pre>
</section>
</template>

<template id="L-analise-testes">
<section class="sec" id="s-atc" data-anchor="ATC">
  <h2><span class="ic" aria-hidden="true">&#xe06e;</span>Análise estática com o ATC</h2>
  <div class="prose"><p>O <b>ABAP Test Cockpit</b> roda verificações estáticas sobre o código: sintaxe, performance, segurança e prontidão para cloud. No ADT, clique com o botão direito no objeto e escolha <b>Run As › ABAP Test Cockpit</b> (<kbd>Ctrl+Shift+F2</kbd>). Uma <b>variante de verificação</b> define quais checks rodam.</p></div>
  <div class="card flush">
    <div class="card-h"><span class="ic">&#xe25e;</span><div><h3>ATC Problems · exemplo de resultado</h3><p>Prioridade 1 bloqueia o transporte na maioria das configurações.</p></div></div>
    <div class="tbl-wrap"><table class="t">
      <thead><tr><th>Prioridade</th><th>Verificação</th><th>Achado</th><th>Objeto</th></tr></thead>
      <tbody>
        <tr><td><span class="tag err"><span class="ic">&#xe0b1;</span>1</span></td><td>Cloud readiness</td><td>Uso de objeto não liberado <code>MARA</code></td><td class="mono">ZCL_MATERIAL_INFO</td></tr>
        <tr><td><span class="tag warn"><span class="ic">&#xe201;</span>2</span></td><td>Performance</td><td>SELECT dentro de LOOP</td><td class="mono">ZCL_FLIGHT_REPORT</td></tr>
        <tr><td><span class="tag info"><span class="ic">&#xe202;</span>3</span></td><td>Clean code</td><td>Variável declarada e nunca usada</td><td class="mono">ZCL_FLIGHT_REPORT</td></tr>
      </tbody>
    </table></div>
  </div>
</section>

<section class="sec" id="s-unit" data-anchor="ABAP Unit">
  <h2><span class="ic" aria-hidden="true">&#xe203;</span>Testes unitários com ABAP Unit</h2>
  <div class="prose"><p>Classes de teste são locais, ficam na aba <b>Test Classes</b> e levam <code>FOR TESTING</code>. O método <code>setup</code> roda antes de cada teste; as asserções vêm de <code>CL_ABAP_UNIT_ASSERT</code>. Execute com <kbd>Ctrl+Shift+F10</kbd>.</p></div>
  <div class="grid2">
<pre data-abap data-title="Código testado · ZCL_PRICE_CALC">METHOD apply_discount.
  " Desconto em %: 10 => 10%
  IF i_percent &lt; 0 OR i_percent > 100.
    RAISE EXCEPTION TYPE cx_abap_invalid_value.
  ENDIF.
  r_price = i_price - i_price * i_percent / 100.
ENDMETHOD.</pre>
<pre data-abap data-title="Test Classes">CLASS ltc_price_calc DEFINITION FINAL
  FOR TESTING DURATION SHORT RISK LEVEL HARMLESS.

  PRIVATE SECTION.
    DATA cut TYPE REF TO zcl_price_calc. " class under test
    METHODS setup.
    METHODS ten_percent       FOR TESTING RAISING cx_static_check.
    METHODS zero_percent      FOR TESTING RAISING cx_static_check.
    METHODS invalid_percent   FOR TESTING.
ENDCLASS.

CLASS ltc_price_calc IMPLEMENTATION.
  METHOD setup.
    cut = NEW #( ).
  ENDMETHOD.

  METHOD ten_percent.
    cl_abap_unit_assert=>assert_equals(
      exp = '90.00'
      act = cut->apply_discount( i_price = 100 i_percent = 10 ) ).
  ENDMETHOD.

  METHOD zero_percent.
    cl_abap_unit_assert=>assert_equals(
      exp = '100.00'
      act = cut->apply_discount( i_price = 100 i_percent = 0 ) ).
  ENDMETHOD.

  METHOD invalid_percent.
    TRY.
        cut->apply_discount( i_price = 100 i_percent = 120 ).
        cl_abap_unit_assert=>fail( `Esperava exceção` ).
      CATCH cx_abap_invalid_value.
    ENDTRY.
  ENDMETHOD.
ENDCLASS.</pre>
  </div>
  <div class="card flush" data-widget="unitrunner"></div>
</section>

<section class="sec" id="s-profiling" data-anchor="Profiling e SQL trace">
  <h2><span class="ic" aria-hidden="true">&#xe02d;</span>Profiling e SQL trace</h2>
  <div class="grid2">
    <div class="card obj"><h3>ABAP Profiler</h3><p>Em <b>Profile As › ABAP Application</b> o ADT mede tempo por método e por acesso ao banco. A visão <i>Hit List</i> mostra onde o tempo foi gasto e a <i>Call Timeline</i> revela leituras sequenciais repetidas.</p></div>
    <div class="card obj"><h3>SQL trace</h3><p>Ative pela aplicação <b>ABAP Trace Requests</b> ou pela transação ST05 em sistemas on-premise. O trace lista cada comando enviado ao banco, com duração e quantidade de registros; comandos idênticos repetidos são o sinal de SELECT em loop.</p></div>
  </div>
</section>

<section class="sec" id="s-abapdoc" data-anchor="ABAP Doc">
  <h2><span class="ic" aria-hidden="true">&#xe1b4;</span>Documentando com ABAP Doc</h2>
  <div class="prose"><p>Comentários que começam com <code>"!</code> logo antes de uma declaração viram documentação: aparecem no <b>Element Info</b> (<kbd>F2</kbd>) para quem usa sua classe. Use <code>@parameter</code> e <code>@raising</code> para descrever a assinatura.</p></div>
<pre data-abap data-title="ABAP Doc">"! &lt;p class="shorttext synchronized">Calcula preço com desconto&lt;/p>
"! @parameter i_price   | Preço original
"! @parameter i_percent | Desconto entre 0 e 100
"! @parameter r_price   | Preço final
"! @raising cx_abap_invalid_value | Percentual fora da faixa
METHODS apply_discount
  IMPORTING i_price        TYPE /dmo/total_price
            i_percent      TYPE i
  RETURNING VALUE(r_price) TYPE /dmo/total_price
  RAISING   cx_abap_invalid_value.</pre>
</section>
</template>

<template id="L-tipos-conversoes">
<section class="sec" id="s-regras-conv" data-anchor="Regras de conversão">
  <h2><span class="ic" aria-hidden="true">&#xe204;</span>Conversões implícitas</h2>
  <div class="prose">
    <p>Quando você atribui um valor a uma variável de outro tipo, o ABAP <b>converte automaticamente</b> seguindo regras fixas. Elas são práticas, mas podem surpreender: textos são cortados sem aviso, números são arredondados, e datas não são validadas.</p>
  </div>
  <div class="card flush" data-widget="convlab"></div>
</section>

<section class="sec" id="s-conv-op" data-anchor="CONV e EXACT">
  <h2><span class="ic" aria-hidden="true">&#xe245;</span>Conversão explícita e sem perdas</h2>
  <div class="grid2">
<pre data-abap data-title="Operadores de construção">DATA(amount) = CONV decfloat34( '1234.565' ).

" Força o tipo de um parâmetro na chamada
out->write( CONV string( 42 ) ).

" EXACT: lança exceção se houver perda
TRY.
    DATA(rounded) = EXACT i( '3.5' ).
  CATCH cx_sy_conversion_rounding.
    out->write( `Haveria arredondamento` ).
ENDTRY.

TRY.
    DATA(day) = EXACT d( '20261332' ).
  CATCH cx_sy_conversion_no_date.
    out->write( `Data inválida` ).
ENDTRY.</pre>
    <div class="card obj">
      <h3>Tipo deduzido na declaração inline</h3>
      <div class="tbl-wrap"><table class="t">
        <thead><tr><th>Código</th><th>Tipo resultante</th></tr></thead>
        <tbody>
          <tr><td class="mono">DATA(a) = 5.</td><td class="mono">i</td></tr>
          <tr><td class="mono">DATA(b) = '5'.</td><td class="mono">c LENGTH 1</td></tr>
          <tr><td class="mono">DATA(c) = `5`.</td><td class="mono">string</td></tr>
          <tr><td class="mono">DATA(d) = '3.14'.</td><td class="mono">c LENGTH 4 (texto!)</td></tr>
          <tr><td class="mono">DATA(e) = CONV decfloat34( '3.14' ).</td><td class="mono">decfloat34</td></tr>
          <tr><td class="mono">DATA(f) = cl_abap_context_info=&gt;get_system_date( ).</td><td class="mono">d</td></tr>
        </tbody>
      </table></div>
    </div>
  </div>
</section>

<section class="sec" id="s-calc-type" data-anchor="Tipo de cálculo">
  <h2><span class="ic" aria-hidden="true">&#xe151;</span>Tipo de cálculo em expressões</h2>
  <div class="prose">
    <p>Antes de calcular, o ABAP escolhe um <b>tipo de cálculo</b> com base em todos os operandos <i>e</i> no destino. A hierarquia é <code>i</code> → <code>int8</code> → <code>p</code> → <code>decfloat34</code>: vale o tipo mais “forte” presente. Isso explica por que <code>DATA(x) = 7 / 2.</code> resulta em 4 e não em 3,5.</p>
  </div>
<pre data-abap data-title="Exemplos">DATA int  TYPE i.
DATA pack TYPE p LENGTH 8 DECIMALS 2.

int  = 7 / 2.                    " 4    (cálculo em i, arredondado)
pack = 7 / 2.                    " 3.50 (cálculo em p por causa do destino)
DATA(x) = 7 / 2.                 " 4    (tipo deduzido: i)
DATA(y) = CONV decfloat34( 7 ) / 2.  " 3.5</pre>
</section>
</template>

<template id="L-strings">
<section class="sec" id="s-tpl" data-anchor="String templates">
  <h2><span class="ic" aria-hidden="true">&#xe27b;</span>String templates</h2>
  <div class="prose"><p>Entre barras verticais <code>|…|</code> você mistura texto e expressões dentro de <code>{ }</code>. As opções de formatação substituem o antigo <code>WRITE TO</code>.</p></div>
<pre data-abap data-title="Formatação em templates">DATA(carrier) = `LH`.
DATA(price)   = CONV decfloat34( '1234.5' ).
DATA(today)   = cl_abap_context_info=>get_system_date( ).

out->write( |Voo { carrier } custa { price NUMBER = USER }| ).
out->write( |{ carrier WIDTH = 8 ALIGN = RIGHT PAD = '.' }| ).  " ......LH
out->write( |{ `abap` CASE = UPPER }| ).                       " ABAP
out->write( |Data: { today DATE = ISO }| ).                    " 2026-10-27
out->write( |{ 7 / 2 DECIMALS = 2 }| ).
out->write( |Linha 1\nLinha 2| ).                              " quebra de linha</pre>
</section>

<section class="sec" id="s-funcs" data-anchor="Laboratório de funções">
  <h2><span class="ic" aria-hidden="true">&#xe139;</span>Laboratório de funções de texto</h2>
  <div class="prose"><p>Funções embutidas recebem parâmetros nomeados como <code>val</code>, <code>sub</code>, <code>off</code> e <code>len</code>. Escolha uma função, altere o texto e os parâmetros e veja a expressão ABAP e o resultado.</p></div>
  <div class="card flush" data-widget="strlab"></div>
</section>

<section class="sec" id="s-regex" data-anchor="Regex">
  <h2><span class="ic" aria-hidden="true">&#xe00d;</span>Expressões regulares</h2>
  <div class="prose"><p>No ABAP Cloud, use a sintaxe PCRE com <code>PCRE =</code> nas funções e comandos, ou as classes <code>CL_ABAP_REGEX</code> e <code>CL_ABAP_MATCHER</code>.</p></div>
<pre data-abap data-title="PCRE">DATA(email) = `ana.souza@exemplo.com.br`.

IF matches( val = email pcre = `^[\w.+-]+@[\w-]+(\.[\w-]+)+$` ).
  out->write( `E-mail válido` ).
ENDIF.

DATA(digits) = replace( val = `(81) 3333-4444` pcre = `\D` with = `` occ = 0 ).
" 8133334444

FIND ALL OCCURRENCES OF PCRE `\d{4}` IN `Voos 0400 e 0401`
     RESULTS DATA(hits).
out->write( lines( hits ) ).   " 2</pre>
</section>
</template>

<section class="sec" id="s-agg" data-anchor="Agregações">
  <h2><span class="ic" aria-hidden="true">&#xe0cf;</span>Agregações, GROUP BY e CASE</h2>
  <div class="prose"><p>Escolha a função de agregação, a condição <code>HAVING</code> e a classificação por <code>CASE</code>. O resultado é calculado sobre os voos de exemplo exatamente como o banco faria.</p></div>
  <div class="card flush" data-widget="agglab"></div>
</section>

<section class="sec" id="s-joins" data-anchor="Joins e expressões">
  <h2><span class="ic" aria-hidden="true">&#xe088;</span>Joins e expressões SQL</h2>
  <div class="grid2">
<pre data-abap data-title="INNER e LEFT OUTER JOIN">SELECT FROM /dmo/connection AS c
         INNER JOIN /dmo/carrier AS a
           ON c~carrier_id = a~carrier_id
         LEFT OUTER JOIN /dmo/airport AS ap
           ON c~airport_to_id = ap~airport_id
  FIELDS c~carrier_id, a~name AS carrier_name,
         c~connection_id, ap~city AS destination
  WHERE c~carrier_id IN ('LH', 'AA')
  INTO TABLE @DATA(routes).</pre>
<pre data-abap data-title="Expressões no SELECT">SELECT FROM /dmo/flight
  FIELDS carrier_id, connection_id, flight_date,
         seats_max - seats_occupied AS seats_free,
         CAST( seats_occupied AS FLTP ) * 100
           / CAST( seats_max AS FLTP ) AS load_pct,
         concat_with_space( carrier_id,
                            connection_id, 1 ) AS flight_code,
         CASE WHEN seats_occupied >= seats_max THEN 'X'
              ELSE ' ' END AS is_full
  WHERE flight_date >= @( cl_abap_context_info=>get_system_date( ) )
  INTO TABLE @DATA(flights).</pre>
  </div>
</section>
</template>

<template id="L-performance-tabelas">
<section class="sec" id="s-complex" data-anchor="Custo de leitura">
  <h2><span class="ic" aria-hidden="true">&#xe0cf;</span>Quanto custa encontrar uma linha</h2>
  <div class="prose"><p>Arraste o controle para mudar o tamanho da tabela e veja o número médio de comparações para ler uma linha pela chave. A diferença entre linear e binário é pequena com 20 linhas e enorme com 100 mil.</p></div>
  <div class="card flush" data-widget="perfchart"></div>
</section>

<section class="sec" id="s-keys" data-anchor="Chaves secundárias">
  <h2><span class="ic" aria-hidden="true">&#xe20e;</span>Chaves secundárias</h2>
  <div class="prose"><p>Uma tabela pode ter uma chave primária e várias <b>chaves secundárias</b>, sorted ou hashed. Assim você lê rápido por critérios diferentes sem manter cópias da tabela.</p></div>
<pre data-abap data-title="Chave secundária">DATA flights TYPE STANDARD TABLE OF /dmo/flight
  WITH NON-UNIQUE KEY carrier_id connection_id flight_date
  WITH NON-UNIQUE SORTED KEY by_plane COMPONENTS plane_type_id.

" Leitura usando a chave secundária
LOOP AT flights INTO DATA(f) USING KEY by_plane
     WHERE plane_type_id = 'A380-800'.
ENDLOOP.

DATA(first_a380) = flights[ KEY by_plane plane_type_id = 'A380-800' ].</pre>
</section>

<section class="sec" id="s-access" data-anchor="Acesso às linhas">
  <h2><span class="ic" aria-hidden="true">&#xe1aa;</span>Work area, field-symbol ou referência</h2>
  <div class="grid3">
    <div class="card obj"><span class="tag warn">INTO wa</span><p>Copia a linha. Simples, mas caro para linhas largas e não altera a tabela sem <code>MODIFY</code>.</p></div>
    <div class="card obj"><span class="tag ok">ASSIGNING &lt;fs&gt;</span><p>Aponta direto para a linha na tabela. Sem cópia; alterações refletem na hora.</p></div>
    <div class="card obj"><span class="tag info">REFERENCE INTO ref</span><p>Como field-symbol, mas a referência pode ser guardada ou passada adiante.</p></div>
  </div>
  <div class="strip warn"><span class="ic">&#xe201;</span><p>Evite <code>SELECT</code> dentro de <code>LOOP</code>. Leia tudo de uma vez com JOIN ou <code>FOR ALL ENTRIES</code> e depois combine em memória com tabelas sorted ou hashed.</p></div>
<pre data-abap data-title="Antes e depois">" Lento: uma ida ao banco por linha
LOOP AT connections INTO DATA(c).
  SELECT SINGLE name FROM /dmo/carrier
    WHERE carrier_id = @c-carrier_id INTO @DATA(name).
ENDLOOP.

" Rápido: uma leitura + tabela hashed
SELECT FROM /dmo/carrier FIELDS carrier_id, name
  INTO TABLE @DATA(carriers).
DATA carrier_by_id TYPE HASHED TABLE OF /dmo/carrier
     WITH UNIQUE KEY carrier_id.
carrier_by_id = CORRESPONDING #( carriers ).

LOOP AT connections ASSIGNING FIELD-SYMBOL(&lt;c>).
  DATA(carrier_name) = VALUE #( carrier_by_id[ carrier_id = &lt;c>-carrier_id ]-name OPTIONAL ).
ENDLOOP.</pre>
</section>
</template>

  <div class="prose"><p>Para leituras via CDS, um <b>access control</b> (DCL) filtra as linhas automaticamente em todo <code>SELECT</code> na view. Você não precisa repetir a verificação em cada programa.</p></div>
<pre data-abap data-lang="DCL" data-title="Access control · ZI_TRAVEL">@EndUserText.label: 'Viagens por país autorizado'

    where ( CountryCode ) =

<template id="L-oo-avancado">
<section class="sec" id="s-heranca" data-anchor="Herança e interfaces">
  <h2><span class="ic" aria-hidden="true">&#xe0f4;</span>Herança, interfaces e polimorfismo</h2>
  <div class="prose">
    <p><b>Herança</b> (<code>INHERITING FROM</code>) reaproveita implementação: a subclasse recebe tudo da superclasse e pode <b>redefinir</b> métodos com <code>REDEFINITION</code>. <b>Interfaces</b> definem um contrato sem implementação; uma classe pode implementar várias.</p>
    <p><b>Polimorfismo</b>: uma referência do tipo da superclasse ou interface pode apontar para qualquer subclasse. O método chamado é decidido em tempo de execução pelo tipo real do objeto.</p>
  </div>

<section class="sec" id="s-poly" data-anchor="Polimorfismo">
  <h2><span class="ic" aria-hidden="true">&#xe0c6;</span>Polimorfismo na prática</h2>
  <div class="card flush" data-widget="poly"></div>
</section>

<section class="sec" id="s-patterns" data-anchor="Padrões">
  <h2><span class="ic" aria-hidden="true">&#xe0c7;</span>Factory e singleton</h2>
  <div class="prose"><p>Com <code>CREATE PRIVATE</code> só a própria classe instancia objetos. Isso permite um método de fábrica que valida os dados antes de criar, ou um singleton que garante uma única instância.</p></div>
  <div class="grid2">
<pre data-abap data-title="Factory">CLASS lcl_connection DEFINITION CREATE PRIVATE.
  PUBLIC SECTION.
    CLASS-METHODS create
      IMPORTING i_carrier_id    TYPE /dmo/carrier_id
                i_connection_id TYPE /dmo/connection_id
      RETURNING VALUE(r_result) TYPE REF TO lcl_connection
      RAISING   cx_abap_invalid_value.
ENDCLASS.

CLASS lcl_connection IMPLEMENTATION.
  METHOD create.
    " valida antes de existir o objeto
    IF i_carrier_id IS INITIAL.
      RAISE EXCEPTION TYPE cx_abap_invalid_value.
    ENDIF.
    r_result = NEW #( ).
  ENDMETHOD.
ENDCLASS.</pre>
<pre data-abap data-title="Singleton">CLASS lcl_config DEFINITION CREATE PRIVATE.
  PUBLIC SECTION.
    CLASS-METHODS get_instance
      RETURNING VALUE(r_instance) TYPE REF TO lcl_config.
  PRIVATE SECTION.
    CLASS-DATA instance TYPE REF TO lcl_config.
ENDCLASS.

CLASS lcl_config IMPLEMENTATION.
  METHOD get_instance.
    IF instance IS NOT BOUND.
      instance = NEW #( ).
    ENDIF.
    r_instance = instance.
  ENDMETHOD.
ENDCLASS.</pre>
  </div>
</section>
</template>

<pre data-abap data-title="ZCX_TRAVEL_INVALID">CLASS zcx_travel_invalid DEFINITION PUBLIC
  INHERITING FROM cx_static_check FINAL CREATE PUBLIC.

  PUBLIC SECTION.
    INTERFACES if_t100_message.
    INTERFACES if_t100_dyn_msg.

    CONSTANTS:
      BEGIN OF dates_inconsistent,
        msgid TYPE symsgid VALUE 'ZTRAVEL',
        msgno TYPE symsgno VALUE '001',
        attr1 TYPE scx_attrname VALUE 'BEGIN_DATE',
        attr2 TYPE scx_attrname VALUE 'END_DATE',
        attr3 TYPE scx_attrname VALUE '',
        attr4 TYPE scx_attrname VALUE '',
      END OF dates_inconsistent.

    DATA begin_date TYPE /dmo/begin_date READ-ONLY.
    DATA end_date   TYPE /dmo/end_date READ-ONLY.

    METHODS constructor
      IMPORTING textid     LIKE if_t100_message=>t100key OPTIONAL
                previous   LIKE previous OPTIONAL
                begin_date TYPE /dmo/begin_date OPTIONAL
                end_date   TYPE /dmo/end_date OPTIONAL.
ENDCLASS.

" Lançando:
RAISE EXCEPTION NEW zcx_travel_invalid(
  textid     = zcx_travel_invalid=>dates_inconsistent
  begin_date = begin
  end_date   = end ).</pre>

<template id="L-modelagem">
<section class="sec" id="s-ddic" data-anchor="Dicionário">
  <h2><span class="ic" aria-hidden="true">&#xe080;</span>ABAP Dictionary e ABAP CDS</h2>
  <div class="prose">
    <p>O <b>ABAP Dictionary</b> descreve tipos e tabelas de banco de forma central: o que você define ali pode ser usado em qualquer programa. O <b>ABAP CDS</b> (<i>Core Data Services</i>) acrescenta modelos semânticos sobre essas tabelas, como views, associações e regras de acesso.</p>
  </div>
  <div class="grid2">
    <div class="card obj"><h3>Objetos do Dictionary</h3>
      <dl class="kv"><dt>Domínio</dt><dd>Tipo técnico, tamanho e valores fixos.</dd><dt>Elemento de dados</dt><dd>Significado de negócio e rótulos de campo.</dd><dt>Estrutura</dt><dd>Tipo estruturado global.</dd><dt>Tipo de tabela</dt><dd>Tipo global de tabela interna.</dd><dt>Tabela de banco</dt><dd>Definição da tabela física.</dd></dl>
    </div>
    <div class="card obj"><h3>Objetos CDS</h3>
      <dl class="kv"><dt>View entity</dt><dd>Leitura modelada, com joins, associações e cálculos.</dd><dt>Abstract / custom entity</dt><dd>Tipos e entidades sem persistência própria.</dd><dt>Access control (DCL)</dt><dd>Regras de autorização por linha.</dd><dt>Metadata extension</dt><dd>Anotações de UI separadas da view.</dd><dt>Behavior definition</dt><dd>Comportamento transacional RAP.</dd></dl>
    </div>
  </div>
</section>

<template id="L-tabelas-bd">
<section class="sec" id="s-define" data-anchor="DEFINE TABLE">
  <h2><span class="ic" aria-hidden="true">&#xe0ba;</span>Definindo uma tabela de banco</h2>
  <div class="prose"><p>No ADT, tabelas são definidas em código fonte com <code>define table</code>. As anotações informam categoria de entrega, possibilidade de manutenção e extensibilidade. Campos monetários precisam apontar para o campo de moeda.</p></div>
<pre data-abap data-lang="DDL" data-title="ZTRAVEL">@EndUserText.label : 'Viagens'
@AbapCatalog.enhancement.category : #NOT_EXTENSIBLE
@AbapCatalog.tableCategory : #TRANSPARENT
@AbapCatalog.deliveryClass : #A
@AbapCatalog.dataMaintenance : #RESTRICTED
define table ztravel {
  key client      : abap.clnt not null;
  key travel_uuid : sysuuid_x16 not null;
  travel_id       : /dmo/travel_id;
  agency_id       : /dmo/agency_id;
  description     : /dmo/description;
  begin_date      : /dmo/begin_date;
  end_date        : /dmo/end_date;
  @Semantics.amount.currencyCode : 'ztravel.currency_code'
  total_price     : /dmo/total_price;
  currency_code   : /dmo/currency_code;
  status          : /dmo/travel_status;
  local_last_changed_at : abp_locinst_lastchange_tstmpl;
}</pre>
  <div class="grid3">
    <div class="card obj"><h3>Classe de entrega</h3><p><code>#A</code> dados de aplicação (mestre e movimento); <code>#C</code> customizing; <code>#L</code> dados temporários.</p></div>
    <div class="card obj"><h3>Chave primária</h3><p>Campos <code>key</code> vêm primeiro e são <code>not null</code>. O mandante (<code>abap.clnt</code>) abre a chave em tabelas dependentes de mandante.</p></div>
    <div class="card obj"><h3>Tabelas de verificação</h3><p>Chaves estrangeiras (<code>with foreign key</code>) documentam relações e alimentam ajudas de pesquisa.</p></div>
  </div>
</section>

<section class="sec" id="s-builder" data-anchor="Construtor">
  <h2><span class="ic" aria-hidden="true">&#xe0e6;</span>Construtor de tabela</h2>

<pre data-abap data-title="Preenchendo a tabela">DELETE FROM ztravel.

INSERT ztravel FROM TABLE @( VALUE #(

out->write( |Inseridas: { sy-dbcnt }| ).</pre>
