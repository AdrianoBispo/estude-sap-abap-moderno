<template id="L-modelagem">
<section class="sec" id="s-ddic" data-anchor="Dicionário">
  <h2><span class="ic" aria-hidden="true">&#xe080;</span>ABAP Dictionary e ABAP CDS</h2>
  <div class="prose">
    <p>O <b>ABAP Dictionary</b> descreve tipos e tabelas de banco de forma central: o que você define ali pode ser usado em qualquer programa. O <b>ABAP CDS</b> (<i>Core Data Services</i>) acrescenta modelos semânticos sobre essas tabelas, como views, associações e regras de acesso.</p>
  </div>
  <div class="grid2">
    <div class="card obj"><h3>Objetos do Dictionary</h3>
      <dl class="kv"><dt>Domínio</dt><dd>Tipo técnico, tamanho e valores fixos.</dd><dt>Elemento de dados</dt><dd>Significado de negócio e rótulos de campo.</dd><dt>Estrutura</dt><dd>Tipo estruturado global.</dd><dt>Tipo de tabela</dt><dd>Tipo global de tabela interna.</dd><dt>Tabela de banco</dt><dd>Definição da tabela física.</dd></dl>
    </div>
    <div class="card obj"><h3>Objetos CDS</h3>
      <dl class="kv"><dt>View entity</dt><dd>Leitura modelada, com joins, associações e cálculos.</dd><dt>Abstract / custom entity</dt><dd>Tipos e entidades sem persistência própria.</dd><dt>Access control (DCL)</dt><dd>Regras de autorização por linha.</dd><dt>Metadata extension</dt><dd>Anotações de UI separadas da view.</dd><dt>Behavior definition</dt><dd>Comportamento transacional RAP.</dd></dl>
    </div>
  </div>
</section>

<template id="L-tabelas-bd">
<section class="sec" id="s-define" data-anchor="DEFINE TABLE">
  <h2><span class="ic" aria-hidden="true">&#xe0ba;</span>Definindo uma tabela de banco</h2>
  <div class="prose"><p>No ADT, tabelas são definidas em código fonte com <code>define table</code>. As anotações informam categoria de entrega, possibilidade de manutenção e extensibilidade. Campos monetários precisam apontar para o campo de moeda.</p></div>
<pre data-abap data-lang="DDL" data-title="ZTRAVEL">@EndUserText.label : 'Viagens'
@AbapCatalog.enhancement.category : #NOT_EXTENSIBLE
@AbapCatalog.tableCategory : #TRANSPARENT
@AbapCatalog.deliveryClass : #A
@AbapCatalog.dataMaintenance : #RESTRICTED
define table ztravel {
  key client      : abap.clnt not null;
  key travel_uuid : sysuuid_x16 not null;
  travel_id       : /dmo/travel_id;
  agency_id       : /dmo/agency_id;
  description     : /dmo/description;
  begin_date      : /dmo/begin_date;
  end_date        : /dmo/end_date;
  @Semantics.amount.currencyCode : 'ztravel.currency_code'
  total_price     : /dmo/total_price;
  currency_code   : /dmo/currency_code;
  status          : /dmo/travel_status;
  local_last_changed_at : abp_locinst_lastchange_tstmpl;
}</pre>
  <div class="grid3">
    <div class="card obj"><h3>Classe de entrega</h3><p><code>#A</code> dados de aplicação (mestre e movimento); <code>#C</code> customizing; <code>#L</code> dados temporários.</p></div>
    <div class="card obj"><h3>Chave primária</h3><p>Campos <code>key</code> vêm primeiro e são <code>not null</code>. O mandante (<code>abap.clnt</code>) abre a chave em tabelas dependentes de mandante.</p></div>
    <div class="card obj"><h3>Tabelas de verificação</h3><p>Chaves estrangeiras (<code>with foreign key</code>) documentam relações e alimentam ajudas de pesquisa.</p></div>
  </div>
</section>

<section class="sec" id="s-builder" data-anchor="Construtor">
  <h2><span class="ic" aria-hidden="true">&#xe0e6;</span>Construtor de tabela</h2>
  <div class="prose"><p>Adicione campos e veja a definição gerada. As validações seguem as regras do Dictionary: nome da tabela com até 16 caracteres no namespace do cliente, campos com até 30, chave antes dos demais campos.</p></div>
  <div class="card flush" data-widget="tablebuilder"></div>
</section>

<section class="sec" id="s-fill" data-anchor="Gravando dados">
  <h2><span class="ic" aria-hidden="true">&#xe010;</span>Gravando dados de teste</h2>
  <div class="prose"><p>Para tabelas próprias sem business object, uma classe de console pode preencher dados de teste com ABAP SQL. Em aplicações, prefira sempre a EML.</p></div>
<pre data-abap data-title="Preenchendo a tabela">DELETE FROM ztravel.

INSERT ztravel FROM TABLE @( VALUE #(
  ( client = sy-mandt travel_uuid = cl_system_uuid=>create_uuid_x16_static( )
    travel_id = '00000001' description = 'Congresso em Lisboa'
    begin_date = '20261110' end_date = '20261114'
    total_price = '2450.00' currency_code = 'EUR' status = 'N' ) ) ).

out->write( |Inseridas: { sy-dbcnt }| ).</pre>
</section>
</template>

<template id="L-cds-basico">
<section class="sec" id="s-view" data-anchor="View entity">
  <h2><span class="ic" aria-hidden="true">&#xe1d8;</span>CDS view entities</h2>
  <div class="prose"><p>Uma <b>CDS view entity</b> é uma consulta com nome, definida em DDL, que vive no banco como view SQL. Ela renomeia campos para nomes semânticos, filtra, calcula e é a base do modelo de dados virtual (VDM) do S/4HANA.</p></div>
<pre data-abap data-lang="CDS" data-title="ZI_Connection">@AccessControl.authorizationCheck: #NOT_REQUIRED
@EndUserText.label: 'Conexões de voo'
define view entity ZI_Connection
  as select from /dmo/connection
{
  key carrier_id      as CarrierId,
  key connection_id   as ConnectionId,
      airport_from_id as AirportFromId,
      airport_to_id   as AirportToId,
      departure_time  as DepartureTime,
      @Semantics.quantity.unitOfMeasure: 'DistanceUnit'
      distance        as Distance,
      distance_unit   as DistanceUnit
}
where distance_unit = 'KM'</pre>
  <div class="grid3">
    <div class="card obj"><span class="tag info">Nome</span><p>Convenção VDM: <code>I_</code> interface, <code>C_</code> consumo, <code>R_</code> raiz de BO. No cliente, prefixe com <code>Z</code>.</p></div>
    <div class="card obj"><span class="tag info">Chave</span><p><code>key</code> marca os elementos que identificam uma linha. Eles vêm primeiro na lista.</p></div>
    <div class="card obj"><span class="tag info">Preview</span><p><kbd>F8</kbd> na view abre o Data Preview; ABAP SQL lê a view como uma tabela.</p></div>
  </div>
</section>

<section class="sec" id="s-param" data-anchor="Parâmetros">
  <h2><span class="ic" aria-hidden="true">&#xe076;</span>Views com parâmetros</h2>
  <div class="grid2">
<pre data-abap data-lang="CDS" data-title="ZI_FlightsFrom">define view entity ZI_FlightsFrom
  with parameters
    p_from : /dmo/flight_date
  as select from /dmo/flight
{
  key carrier_id    as CarrierId,
  key connection_id as ConnectionId,
  key flight_date   as FlightDate,
      seats_max - seats_occupied as SeatsFree
}
where flight_date >= $parameters.p_from</pre>
<pre data-abap data-title="Lendo com parâmetro">SELECT FROM zi_flightsfrom(
         p_from = @( cl_abap_context_info=>get_system_date( ) ) )
  FIELDS CarrierId, FlightDate, SeatsFree
  ORDER BY FlightDate
  INTO TABLE @DATA(next_flights)
  UP TO 20 ROWS.</pre>
  </div>
</section>

<section class="sec" id="s-joincds" data-anchor="Joins">
  <h2><span class="ic" aria-hidden="true">&#xe088;</span>Joins em CDS</h2>
<pre data-abap data-lang="CDS" data-title="Join">define view entity ZI_ConnectionWithCarrier
  as select from /dmo/connection as c
    inner join   /dmo/carrier    as a on c.carrier_id = a.carrier_id
{
  key c.carrier_id    as CarrierId,
  key c.connection_id as ConnectionId,
      a.name          as CarrierName
}</pre>
  <div class="strip"><span class="ic">&#xe289;</span><p>Em CDS o separador é o ponto (<code>c.carrier_id</code>); em ABAP SQL é o til (<code>c~carrier_id</code>).</p></div>
</section>
</template>

<template id="L-associacoes">
<section class="sec" id="s-assoc" data-anchor="Associações">
  <h2><span class="ic" aria-hidden="true">&#xe088;</span>Associações: joins sob demanda</h2>
  <div class="prose">
    <p>Uma <b>associação</b> declara a relação entre duas entidades sem executar o join. O join só acontece quando alguém usa a associação numa <b>expressão de caminho</b>, como <code>_Carrier.Name</code>. Por convenção, o nome começa com sublinhado.</p>
    <p>A <b>cardinalidade</b> diz quantas linhas do destino correspondem a uma da origem. Ela ajuda o otimizador e evita multiplicar linhas por engano.</p>
  </div>
  <figure class="figure card">
    <div class="svg-scroll">
    <svg class="illu" viewBox="0 0 660 210" role="img" aria-labelledby="figer">
      <title id="figer">ZI_Connection associada a ZI_Carrier com cardinalidade 1..1 e a ZI_Flight com cardinalidade 0..*</title>
      <g transform="translate(230 50)"><rect width="200" height="110" rx="12" class="fsel ssel" stroke-width="1.5"/><text x="100" y="26" text-anchor="middle" class="h tsel">ZI_Connection</text><line x1="0" y1="38" x2="200" y2="38" class="ssel"/>
        <text x="14" y="58" class="mono tx" font-size="10.5">key CarrierId</text><text x="14" y="74" class="mono tx" font-size="10.5">key ConnectionId</text><text x="14" y="90" class="mono tsel" font-size="10.5">_Carrier</text><text x="110" y="90" class="mono tsel" font-size="10.5">_Flights</text></g>
      <g transform="translate(10 60)"><rect width="160" height="90" rx="12" class="fb sb" stroke-width="1.5"/><text x="80" y="26" text-anchor="middle" class="h tx">ZI_Carrier</text><line x1="0" y1="38" x2="160" y2="38" class="sb"/><text x="14" y="58" class="mono tx" font-size="10.5">key CarrierId</text><text x="14" y="74" class="mono tx" font-size="10.5">Name</text></g>
      <g transform="translate(490 60)"><rect width="160" height="90" rx="12" class="fb sb" stroke-width="1.5"/><text x="80" y="26" text-anchor="middle" class="h tx">ZI_Flight</text><line x1="0" y1="38" x2="160" y2="38" class="sb"/><text x="14" y="58" class="mono tx" font-size="10.5">key …FlightDate</text><text x="14" y="74" class="mono tx" font-size="10.5">Price</text></g>
      <path d="M230 105 H170" class="ssel" stroke-width="2"/><text x="200" y="96" text-anchor="middle" class="mono tsel" font-size="11">[1..1]</text>
      <path d="M430 105 H490" class="ssel" stroke-width="2"/><text x="460" y="96" text-anchor="middle" class="mono tsel" font-size="11">[0..*]</text>
      <text x="330" y="190" text-anchor="middle" class="sm tl">o join só é gerado quando o caminho é usado</text>
    </svg>
    </div>
  </figure>
<pre data-abap data-lang="CDS" data-title="ZI_Connection com associações">define view entity ZI_Connection
  as select from /dmo/connection
  association [1..1] to ZI_Carrier as _Carrier
    on $projection.CarrierId = _Carrier.CarrierId
  association [0..*] to ZI_Flight  as _Flights
    on  $projection.CarrierId    = _Flights.CarrierId
    and $projection.ConnectionId = _Flights.ConnectionId
{
  key carrier_id    as CarrierId,
  key connection_id as ConnectionId,
      airport_from_id as AirportFromId,
      airport_to_id   as AirportToId,
      _Carrier.Name   as CarrierName,   " expressão de caminho
      /* expostas para quem consome a view */
      _Carrier,
      _Flights
}</pre>
</section>

<section class="sec" id="s-pathlab" data-anchor="Explorador de caminhos">
  <h2><span class="ic" aria-hidden="true">&#xe1d8;</span>Explorador de expressões de caminho</h2>
  <div class="prose"><p>Escolha o que projetar a partir de <code>ZI_Connection</code>. Repare como o caminho por uma associação <code>[0..*]</code> multiplica as linhas do resultado, e como o filtro na associação resolve isso.</p></div>
  <div class="card flush" data-widget="pathlab"></div>
</section>

<section class="sec" id="s-abapsqlpath" data-anchor="Em ABAP SQL">
  <h2><span class="ic" aria-hidden="true">&#xe244;</span>Usando associações em ABAP SQL</h2>
<pre data-abap data-title="Caminho em ABAP SQL">SELECT FROM zi_connection
  FIELDS CarrierId, ConnectionId,
         \_Carrier-Name AS CarrierName,
         \_Carrier-CurrencyCode AS Currency
  WHERE CarrierId = 'LH'
  INTO TABLE @DATA(result).</pre>
  <div class="strip"><span class="ic">&#xe289;</span><p>Em ABAP SQL o caminho começa com barra invertida e usa hífen: <code>\_Carrier-Name</code>. Filtros e cardinalidade entram entre colchetes.</p></div>
</section>
</template>

<template id="L-cds-pushdown">
<section class="sec" id="s-expr" data-anchor="Expressões">
  <h2><span class="ic" aria-hidden="true">&#xe139;</span>Expressões e funções em CDS</h2>
  <div class="grid2">
<pre data-abap data-lang="CDS" data-title="Cálculos na view">define view entity ZI_FlightLoad
  as select from /dmo/flight
{
  key carrier_id    as CarrierId,
  key connection_id as ConnectionId,
  key flight_date   as FlightDate,
      seats_max - seats_occupied as SeatsFree,
      division( seats_occupied * 100, seats_max, 2 ) as LoadPercent,
      cast( price as abap.dec( 16, 2 ) ) as Price,
      concat_with_space( carrier_id, connection_id, 1 ) as FlightCode,
      dats_days_between( $session.system_date, flight_date ) as DaysToGo,
      case
        when seats_occupied >= seats_max      then 'Lotado'
        when seats_occupied >= seats_max * 0.8 then 'Quase cheio'
        else 'Disponível'
      end as Availability
}</pre>
    <div class="card obj"><h3>Funções frequentes</h3>
      <dl class="kv">
        <dt><code>cast( )</code></dt><dd>Converte tipos, ex.: <code>abap.dec(16,2)</code>.</dd>
        <dt><code>division( a, b, n )</code></dt><dd>Divisão com <i>n</i> casas decimais.</dd>
        <dt><code>concat( )</code></dt><dd>Concatena textos; <code>concat_with_space</code> insere espaços.</dd>
        <dt><code>substring( ), upper( )</code></dt><dd>Manipulação de texto.</dd>
        <dt><code>round( ), abs( ), div( ), mod( )</code></dt><dd>Matemática.</dd>
        <dt><code>dats_days_between( )</code></dt><dd>Dias entre duas datas.</dd>
        <dt><code>$session.system_date</code></dt><dd>Data atual do sistema.</dd>
        <dt><code>currency_conversion( )</code></dt><dd>Converte valores entre moedas.</dd>
      </dl>
    </div>
  </div>
</section>

<section class="sec" id="s-caselab" data-anchor="Laboratório de CASE">
  <h2><span class="ic" aria-hidden="true">&#xe076;</span>Laboratório de CASE</h2>
  <div class="prose"><p>Ajuste os limites de distância e veja a expressão CDS e a classificação das conexões de exemplo, calculadas como o banco faria.</p></div>
  <div class="card flush" data-widget="caselab"></div>
</section>

<section class="sec" id="s-aggcds" data-anchor="Agregação">
  <h2><span class="ic" aria-hidden="true">&#xe0cf;</span>Agregação em CDS</h2>
<pre data-abap data-lang="CDS" data-title="ZI_CarrierStats">define view entity ZI_CarrierStats
  as select from /dmo/flight
{
  key carrier_id                      as CarrierId,
      count( * )                      as Flights,
      sum( seats_occupied )           as Passengers,
      avg( seats_occupied as abap.dec( 10, 2 ) ) as AvgPassengers,
      max( price )                    as MaxPrice,
      currency_code                   as CurrencyCode
}
group by carrier_id, currency_code
having count( * ) > 1</pre>
  <div class="strip"><span class="ic">&#xe289;</span><p>Todo elemento fora de uma função de agregação precisa estar no <code>group by</code>. <code>avg</code> exige <code>as</code> com um tipo decimal ou de ponto flutuante.</p></div>
</section>
</template>

<!-- ===================== CURSO 3 · UNIDADE 6 ===================== -->
<template id="L-meta-objetos">
<section class="sec" id="s-annot" data-anchor="Anotações">
  <h2><span class="ic" aria-hidden="true">&#xe137;</span>Anotações: metadados para quem consome</h2>
  <div class="prose"><p><b>Anotações</b> começam com <code>@</code> e acrescentam significado a uma view ou elemento. Algumas são lidas pelo compilador (<code>@AccessControl</code>), outras pelo framework (<code>@Semantics</code>), outras pela interface Fiori (<code>@UI</code>).</p></div>
  <div class="grid3">
    <div class="card obj"><span class="tag c5">@Semantics</span><p>Relaciona valor e moeda, quantidade e unidade, textos e idiomas.</p></div>
    <div class="card obj"><span class="tag c7">@ObjectModel</span><p>Define texto do elemento, ajuda de valor, categoria de representação.</p></div>
    <div class="card obj"><span class="tag info">@UI</span><p>Posição em listas, filtros, facetas do Object Page, botões de ação.</p></div>
  </div>
</section>

<section class="sec" id="s-uilab" data-anchor="Pré-visualização Fiori">
  <h2><span class="ic" aria-hidden="true">&#xe1e9;</span>Anotações @UI e a list report</h2>
  <div class="prose"><p>Ative <code>@UI.lineItem</code> e <code>@UI.selectionField</code> para cada elemento e veja como o Fiori Elements monta a tela a partir da metadata extension.</p></div>
  <div class="card flush" data-widget="uilab"></div>
</section>

<section class="sec" id="s-mde" data-anchor="Metadata extension">
  <h2><span class="ic" aria-hidden="true">&#xe1b4;</span>Metadata extensions e camadas</h2>
  <div class="prose"><p>Para não poluir a view com anotações de UI, a view permite extensões com <code>@Metadata.allowExtensions: true</code> e as anotações vão para uma <b>metadata extension</b>. Camadas (<code>#CORE</code>, <code>#LOCALIZATION</code>, <code>#INDUSTRY</code>, <code>#PARTNER</code>, <code>#CUSTOMER</code>) definem quem sobrescreve quem: a de cima vence.</p></div>
<pre data-abap data-lang="CDS" data-title="ZC_Travel · metadata extension">@Metadata.layer: #CUSTOMER
@UI.headerInfo: { typeName: 'Viagem', typeNamePlural: 'Viagens',
                  title: { value: 'TravelId' } }
annotate entity ZC_Travel with
{
  @UI.facet: [{ id: 'Travel', purpose: #STANDARD,
                type: #IDENTIFICATION_REFERENCE, label: 'Viagem', position: 10 }]
  @UI.lineItem:       [{ position: 10, importance: #HIGH }]
  @UI.selectionField: [{ position: 10 }]
